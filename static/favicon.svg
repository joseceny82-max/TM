<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b86e8"/>
      <stop offset="100%" stop-color="#026CDF"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e8f1ff" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado azul TM -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#tg)"/>
  <!-- Sombra sutil del ticket -->
  <rect x="9" y="20" width="46" height="26" rx="3" fill="#000" opacity="0.18"/>
  <!-- Cuerpo del ticket con muescas perforadas -->
  <path d="M9 20 h46 v9 a3 3 0 0 0 0 6 v9 h-46 v-9 a3 3 0 0 0 0 -6 z"
        fill="url(#sg)" stroke="#026CDF" stroke-width="0.5"/>
  <!-- Línea de perforación vertical (zona de corte) -->
  <line x1="33" y1="22" x2="33" y2="44" stroke="#026CDF" stroke-width="1" stroke-dasharray="1.5 1.5" opacity="0.55"/>
  <!-- Letras TM en lado izquierdo del ticket -->
  <text x="22" y="38" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#026CDF" text-anchor="middle" letter-spacing="0.5">TM</text>
  <!-- Código de barras en lado derecho -->
  <g fill="#026CDF" opacity="0.85">
    <rect x="38" y="28" width="1.2" height="10"/>
    <rect x="40" y="28" width="0.6" height="10"/>
    <rect x="41.4" y="28" width="1.6" height="10"/>
    <rect x="43.6" y="28" width="0.8" height="10"/>
    <rect x="45" y="28" width="1.2" height="10"/>
    <rect x="46.8" y="28" width="0.6" height="10"/>
    <rect x="47.8" y="28" width="1.4" height="10"/>
    <rect x="49.6" y="28" width="0.8" height="10"/>
    <rect x="51" y="28" width="1.2" height="10"/>
  </g>
  <!-- Estrella indicador VIP en esquina -->
  <text x="50" y="14" font-size="11" fill="#fbbf24" font-weight="900">★</text>
</svg>
