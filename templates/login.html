<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/static/favicon.svg?v=2">
    <link rel="shortcut icon" href="/static/favicon.svg?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-deep:#050816;
            --bg:#0a0e1a;
            --card:rgba(15,23,41,.65);
            --border:rgba(2,108,223,.18);
            --border-hi:rgba(2,108,223,.55);
            --accent:#026CDF;
            --accent2:#0052b4;
            --accent-glow:#3b9eff;
            --pink:#d0006f;
            --purple:#7c3aed;
            --text:#e6e8ec;
            --text-muted:#94a3b8;
            --text-dim:#64748b;
            --danger:#ef4444;
            --success:#22c55e;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden}
        body{
            font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg-deep);
            color:var(--text);
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            position:relative;
            -webkit-font-smoothing:antialiased;
        }

        /* ═══ FONDO ANIMADO: gradient mesh con más colores + más movimiento ═══ */
        .bg-gradient{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                radial-gradient(ellipse 70% 50% at 20% 30%, rgba(2,108,223,.45), transparent 55%),
                radial-gradient(ellipse 55% 60% at 80% 70%, rgba(208,0,111,.40), transparent 60%),
                radial-gradient(ellipse 65% 55% at 70% 20%, rgba(124,58,237,.35), transparent 60%),
                radial-gradient(ellipse 60% 50% at 30% 80%, rgba(245,158,11,.22), transparent 60%),
                radial-gradient(ellipse 80% 60% at 50% 100%, rgba(34,197,94,.18), transparent 60%);
            animation: bgShift 12s ease-in-out infinite alternate;
        }
        @keyframes bgShift{
            0%   { transform:scale(1) translate(0,0); filter:hue-rotate(0deg); }
            33%  { transform:scale(1.08) translate(-3%,-2%); filter:hue-rotate(15deg); }
            66%  { transform:scale(1.04) translate(2%,3%); filter:hue-rotate(-10deg); }
            100% { transform:scale(1.1) translate(3%,-1%); filter:hue-rotate(5deg); }
        }
        .bg-grid{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background-image:
                linear-gradient(rgba(2,108,223,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2,108,223,.06) 1px, transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 75%);
            -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 75%);
        }

        /* ═══ FOCOS DE ESCENARIO (spotlights barriendo) ═══ */
        .spotlights{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
        .spotlight{
            position:absolute;top:-5%;left:50%;width:280px;height:140vh;
            transform-origin:50% 0;
            background:linear-gradient(180deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,.05) 5%,
                rgba(2,108,223,.18) 30%,
                rgba(2,108,223,.08) 60%,
                transparent 95%);
            filter:blur(8px);
            animation: spotlightSweep 8s ease-in-out infinite;
        }
        .spotlight.s1{ animation-delay:0s; left:25%; background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.06) 5%, rgba(2,108,223,.22) 30%, transparent 95%); }
        .spotlight.s2{ animation-delay:-2.7s; left:50%; background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.06) 5%, rgba(208,0,111,.20) 30%, transparent 95%); animation-duration:9s; }
        .spotlight.s3{ animation-delay:-5.3s; left:75%; background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.06) 5%, rgba(124,58,237,.20) 30%, transparent 95%); animation-duration:10s; }
        @keyframes spotlightSweep{
            0%,100% { transform:translateX(-50%) rotate(-22deg); opacity:.55; }
            50%     { transform:translateX(-50%) rotate(22deg); opacity:.85; }
        }

        /* ═══ CONFETTI CAYENDO (tickets pequeños y notas) ═══ */
        .confetti-layer{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
        .confetti{
            position:absolute;top:-50px;
            font-size:18px;
            animation: confettiFall linear infinite;
            opacity:0;
            will-change:transform,opacity;
            filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));
        }
        @keyframes confettiFall{
            0%   { transform:translateY(-50px) rotate(0deg); opacity:0; }
            8%   { opacity:1; }
            92%  { opacity:.9; }
            100% { transform:translateY(105vh) rotate(720deg); opacity:0; }
        }

        /* ═══ ICONOS FLOTANTES MÁS VIVOS Y COLORIDOS ═══ */
        .float-layer{ position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden; }
        .float-icon{
            position:absolute;font-size:38px;opacity:.18;
            animation: floatY 14s ease-in-out infinite;
            filter:drop-shadow(0 0 16px rgba(2,108,223,.6));
            will-change:transform,opacity;
        }
        .float-icon.f1{ top:8%;  left:10%; font-size:50px; animation-delay:0s;   filter:drop-shadow(0 0 18px rgba(245,158,11,.7)); }
        .float-icon.f2{ top:14%; left:85%; font-size:44px; animation-delay:-2s;  filter:drop-shadow(0 0 16px rgba(208,0,111,.7)); }
        .float-icon.f3{ top:72%; left:6%;  font-size:46px; animation-delay:-4s;  filter:drop-shadow(0 0 16px rgba(124,58,237,.7)); }
        .float-icon.f4{ top:82%; left:88%; font-size:40px; animation-delay:-6s;  filter:drop-shadow(0 0 14px rgba(34,197,94,.7)); }
        .float-icon.f5{ top:42%; left:4%;  font-size:36px; animation-delay:-8s;  filter:drop-shadow(0 0 14px rgba(2,108,223,.7)); }
        .float-icon.f6{ top:28%; left:92%; font-size:42px; animation-delay:-10s; filter:drop-shadow(0 0 16px rgba(245,158,11,.7)); }
        .float-icon.f7{ top:60%; left:14%; font-size:38px; animation-delay:-1s;  filter:drop-shadow(0 0 14px rgba(208,0,111,.7)); }
        .float-icon.f8{ top:10%; left:48%; font-size:36px; animation-delay:-5s;  filter:drop-shadow(0 0 14px rgba(124,58,237,.7)); }
        .float-icon.f9{ top:50%; left:90%; font-size:40px; animation-delay:-3s;  filter:drop-shadow(0 0 16px rgba(34,197,94,.7)); }
        .float-icon.f10{ top:88%;left:48%; font-size:38px; animation-delay:-7s;  filter:drop-shadow(0 0 14px rgba(2,108,223,.7)); }
        .float-icon.f11{ top:25%; left:18%; font-size:34px; animation-delay:-9s; filter:drop-shadow(0 0 14px rgba(245,158,11,.7)); }
        .float-icon.f12{ top:65%; left:82%; font-size:42px; animation-delay:-11s; filter:drop-shadow(0 0 16px rgba(208,0,111,.7)); }
        @keyframes floatY{
            0%,100% { transform:translateY(0) rotate(-12deg) scale(1); opacity:.18; }
            25%     { transform:translateY(-24px) rotate(8deg) scale(1.08); opacity:.34; }
            50%     { transform:translateY(-44px) rotate(15deg) scale(1.12); opacity:.40; }
            75%     { transform:translateY(-22px) rotate(-6deg) scale(1.05); opacity:.30; }
        }

        /* ═══ ESTRELLAS TWINKLING ═══ */
        .stars{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .star{
            position:absolute;width:3px;height:3px;border-radius:50%;
            background:#fff;
            box-shadow:0 0 6px #fff, 0 0 12px rgba(2,108,223,.6);
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle{
            0%,100% { opacity:.2; transform:scale(.6); }
            50%     { opacity:1; transform:scale(1.4); }
        }

        /* ═══ PARTÍCULAS FLOTANTES (puntos brillantes ascendentes) ═══ */
        .particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .particle{
            position:absolute;width:4px;height:4px;border-radius:50%;
            background:rgba(2,108,223,.7);
            box-shadow:0 0 14px rgba(2,108,223,.9), 0 0 28px rgba(2,108,223,.5);
            animation: particleFloat 10s linear infinite;
        }
        .particle.p1 {top:95%;left:6%; animation-delay:0s}
        .particle.p2 {top:95%;left:18%;animation-delay:-1.2s; background:rgba(208,0,111,.7);box-shadow:0 0 14px rgba(208,0,111,.9),0 0 28px rgba(208,0,111,.5)}
        .particle.p3 {top:95%;left:30%;animation-delay:-2.4s}
        .particle.p4 {top:95%;left:42%;animation-delay:-3.6s; background:rgba(124,58,237,.7);box-shadow:0 0 14px rgba(124,58,237,.9),0 0 28px rgba(124,58,237,.5)}
        .particle.p5 {top:95%;left:54%;animation-delay:-4.8s}
        .particle.p6 {top:95%;left:66%;animation-delay:-6s;   background:rgba(34,197,94,.7);box-shadow:0 0 14px rgba(34,197,94,.9),0 0 28px rgba(34,197,94,.5)}
        .particle.p7 {top:95%;left:78%;animation-delay:-7.2s; background:rgba(245,158,11,.7);box-shadow:0 0 14px rgba(245,158,11,.9),0 0 28px rgba(245,158,11,.5)}
        .particle.p8 {top:95%;left:88%;animation-delay:-8.4s}
        .particle.p9 {top:95%;left:12%;animation-delay:-3s;   background:rgba(245,158,11,.7);box-shadow:0 0 14px rgba(245,158,11,.9)}
        .particle.p10{top:95%;left:60%;animation-delay:-5.5s; background:rgba(208,0,111,.7);box-shadow:0 0 14px rgba(208,0,111,.9)}
        .particle.p11{top:95%;left:36%;animation-delay:-7s}
        .particle.p12{top:95%;left:84%;animation-delay:-9s;   background:rgba(124,58,237,.7);box-shadow:0 0 14px rgba(124,58,237,.9)}
        @keyframes particleFloat{
            0%   { transform:translateY(0) scale(.5); opacity:0; }
            10%  { opacity:1; }
            90%  { opacity:.7; }
            100% { transform:translateY(-110vh) scale(1.4); opacity:0; }
        }

        /* ═══ ECUALIZADOR PULSANTE EN BASE ═══ */
        .equalizer{
            position:fixed;left:0;right:0;bottom:0;z-index:1;
            display:flex;justify-content:center;align-items:flex-end;gap:5px;
            height:120px;padding:0 20px;pointer-events:none;
            opacity:.55;
            mask-image:linear-gradient(180deg, transparent 0%, #000 60%);
            -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 60%);
        }
        .eq-bar{
            width:7px;
            background:linear-gradient(180deg, #d0006f, #7c3aed, #026CDF);
            border-radius:3px 3px 0 0;
            box-shadow:0 0 10px rgba(2,108,223,.5);
            animation: eqBeat 1s ease-in-out infinite;
            transform-origin:bottom;
        }
        @keyframes eqBeat{
            0%,100% { transform:scaleY(.18); }
            25%     { transform:scaleY(.65); }
            50%     { transform:scaleY(1); }
            75%     { transform:scaleY(.45); }
        }

        /* ═══ TARJETA DE LOGIN — GLASSMORPHISM ═══ */
        .login-wrap{
            position:relative;z-index:10;
            display:flex;flex-direction:column;align-items:center;gap:22px;
            animation: fadeInUp .8s cubic-bezier(.2,.9,.3,1.2) both;
        }
        @keyframes fadeInUp{
            from{ opacity:0; transform:translateY(28px) scale(.97); }
            to  { opacity:1; transform:translateY(0) scale(1); }
        }

        .login-box{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:20px;
            padding:38px 36px 32px;
            width:420px;max-width:94vw;
            box-shadow:
                0 30px 80px rgba(0,0,0,.6),
                0 0 0 1px rgba(255,255,255,.04) inset,
                0 0 60px rgba(2,108,223,.15);
            backdrop-filter:blur(20px) saturate(150%);
            -webkit-backdrop-filter:blur(20px) saturate(150%);
            position:relative;
            overflow:hidden;
        }
        /* Borde superior con gradiente animado */
        .login-box::before{
            content:'';position:absolute;top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg, transparent, var(--accent), var(--pink), var(--purple), var(--accent), transparent);
            background-size:200% 100%;
            animation: shimmerBorder 4s linear infinite;
        }
        @keyframes shimmerBorder{
            0%   { background-position:0% 0; }
            100% { background-position:-200% 0; }
        }

        /* ═══ LOGO + ICONO ═══ */
        .logo{text-align:center;margin-bottom:30px;position:relative}
        .logo-icon-wrap{
            display:inline-flex;
            width:72px;height:72px;border-radius:20px;
            background:linear-gradient(135deg, var(--accent), var(--accent2));
            align-items:center;justify-content:center;
            margin-bottom:16px;
            box-shadow:
                0 12px 32px rgba(2,108,223,.5),
                0 0 0 1px rgba(255,255,255,.12) inset,
                0 0 40px rgba(2,108,223,.25);
            position:relative;
            animation: logoPulse 3.5s ease-in-out infinite;
        }
        @keyframes logoPulse{
            0%,100% { transform:scale(1); box-shadow:0 12px 32px rgba(2,108,223,.5),0 0 0 1px rgba(255,255,255,.12) inset,0 0 40px rgba(2,108,223,.25); }
            50%     { transform:scale(1.04); box-shadow:0 14px 38px rgba(2,108,223,.65),0 0 0 1px rgba(255,255,255,.18) inset,0 0 60px rgba(2,108,223,.4); }
        }
        .logo-icon-wrap svg{ width:42px;height:42px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }

        .logo h1{
            font-family:'Space Grotesk','Inter',sans-serif;
            font-size:30px;letter-spacing:1px;font-weight:800;
            background:linear-gradient(135deg, #fff 0%, #93c5fd 50%, var(--accent-glow) 100%);
            background-size:200% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;color:transparent;
            animation: textShimmer 4s ease-in-out infinite alternate;
        }
        @keyframes textShimmer{
            0%   { background-position:0% center; }
            100% { background-position:100% center; }
        }
        .logo p{
            color:var(--text-muted);font-size:11.5px;margin-top:4px;
            letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
        }

        /* ═══ FORM ═══ */
        .form-group{margin-bottom:18px;position:relative}
        .form-group label{
            display:block;font-size:11px;color:var(--text-muted);
            margin-bottom:7px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;
        }
        .input-wrap{position:relative}
        .input-wrap .input-icon{
            position:absolute;left:14px;top:50%;transform:translateY(-50%);
            color:var(--text-dim);font-size:16px;pointer-events:none;
            transition:color .25s;
        }
        .form-group input{
            width:100%;
            padding:13px 14px 13px 42px;
            background:rgba(10,14,26,.55);
            border:1px solid var(--border);
            border-radius:11px;
            color:var(--text);font-size:14px;font-family:inherit;
            outline:2px solid transparent;outline-offset:2px;
            transition:border-color .25s, box-shadow .25s, background-color .25s;
        }
        .form-group input::placeholder{color:var(--text-dim)}
        .form-group input:focus{
            border-color:var(--accent);
            background:rgba(10,14,26,.85);
            box-shadow:0 0 0 4px rgba(2,108,223,.18), 0 4px 18px rgba(2,108,223,.12);
        }
        .form-group input:focus + .input-icon,
        .form-group:focus-within .input-icon{ color:var(--accent-glow) }

        /* ═══ BOTÓN PRINCIPAL ═══ */
        .btn{
            position:relative;
            width:100%;padding:14px 16px;
            background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color:#fff;border:none;border-radius:11px;
            font-size:13px;font-weight:700;letter-spacing:1.5px;
            cursor:pointer;margin-top:12px;
            text-transform:uppercase;
            font-family:inherit;
            overflow:hidden;
            transition:transform .25s, box-shadow .25s;
            box-shadow:0 8px 24px rgba(2,108,223,.4), 0 0 0 1px rgba(255,255,255,.08) inset;
        }
        .btn::after{
            content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
            transition:left .6s;
        }
        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 14px 32px rgba(2,108,223,.55), 0 0 0 1px rgba(255,255,255,.15) inset, 0 0 30px rgba(2,108,223,.3);
        }
        .btn:hover::after{ left:100% }
        .btn:active{transform:translateY(0)}
        .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
        .btn:disabled{opacity:.7;cursor:wait}
        .btn.loading .btn-text{visibility:hidden}
        .btn.loading::before{
            content:'';position:absolute;top:50%;left:50%;
            width:20px;height:20px;margin:-10px 0 0 -10px;
            border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        /* ═══ ERROR + SHAKE ═══ */
        .error{
            color:var(--danger);font-size:13px;margin-top:14px;
            text-align:center;min-height:20px;font-weight:500;
        }
        .login-box.shake{ animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
        @keyframes shake{
            10%,90% { transform:translate3d(-1px,0,0); }
            20%,80% { transform:translate3d(2px,0,0); }
            30%,50%,70% { transform:translate3d(-4px,0,0); }
            40%,60%     { transform:translate3d(4px,0,0); }
        }

        /* ═══ HINT ═══ */
        .hint{
            color:var(--text-dim);font-size:11.5px;text-align:center;margin-top:18px;
            padding:10px;background:rgba(2,108,223,.06);
            border:1px solid rgba(2,108,223,.12);
            border-radius:8px;letter-spacing:.3px;
        }
        .hint b{color:var(--text);font-weight:600;font-family:'Space Grotesk',monospace}

        /* ═══ FLAGS LANGUAGE TOGGLE ═══ */
        .lang-flags{
            display:flex;justify-content:center;gap:10px;margin-top:6px;
        }
        .flag-btn{
            background:rgba(15,23,41,.6);
            border:2px solid var(--border);
            cursor:pointer;
            padding:0;
            width:46px;height:46px;
            border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            transition:transform .3s cubic-bezier(.2,.9,.3,1.2), border-color .25s, box-shadow .25s, opacity .25s, filter .25s;
            overflow:hidden;
            opacity:.55;
            filter:grayscale(40%);
            backdrop-filter:blur(10px);
            position:relative;
        }
        .flag-btn img{
            width:42px;height:42px;border-radius:50%;
            object-fit:cover;display:block;pointer-events:none;
        }
        .flag-btn::after{
            content:'';position:absolute;inset:-2px;border-radius:50%;
            background:linear-gradient(135deg, var(--accent), var(--pink));
            opacity:0;transition:opacity .25s;z-index:-1;
        }
        .flag-btn:hover{
            transform:translateY(-3px) scale(1.1);
            opacity:.95;filter:grayscale(0%);
            border-color:var(--border-hi);
        }
        .flag-btn.active{
            opacity:1;filter:grayscale(0%);
            border-color:var(--accent);
            box-shadow:
                0 0 0 4px rgba(2,108,223,.2),
                0 8px 20px rgba(2,108,223,.35);
            transform:scale(1.08);
        }
        .flag-btn:focus-visible{outline:2px solid var(--accent-glow);outline-offset:3px}

        /* ═══ FOOTER BADGE ═══ */
        .footer-badge{
            display:flex;align-items:center;gap:6px;
            font-size:10.5px;color:var(--text-dim);font-weight:500;
            letter-spacing:.4px;text-align:center;
            padding:6px 14px;
            background:rgba(15,23,41,.5);
            border:1px solid var(--border);
            border-radius:30px;
            backdrop-filter:blur(10px);
        }
        .footer-badge .dot{
            width:7px;height:7px;border-radius:50%;background:var(--success);
            box-shadow:0 0 8px var(--success);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse{
            0%,100% { opacity:1; transform:scale(1); }
            50%     { opacity:.6; transform:scale(1.2); }
        }

        /* ═══ RESPONSIVE — móvil + tablet con escalado completo ═══ */
        /* Soporte iOS dynamic viewport (100vh incluye toolbar de Safari) */
        @supports (height: 100dvh){
            html,body{ min-height:100dvh; }
        }
        body{
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Tablet (768px y menos): ajuste medio */
        @media (max-width:768px){
            .login-box{ width:380px; padding:32px 28px; }
            .float-icon{ font-size:32px !important; }
            .float-icon.f1,.float-icon.f3{ font-size:38px !important; }
            .float-icon.f2,.float-icon.f6{ font-size:34px !important; }
            .spotlight{ width:200px; }
            .equalizer{ height:90px; gap:4px; }
            .eq-bar{ width:6px; }
        }

        /* Móvil (480px y menos): compacto + density reducido */
        @media (max-width:480px){
            .login-box{
                width:100%;
                padding:26px 22px 24px;
                border-radius:18px;
            }
            .login-wrap{ gap:18px; padding:0 14px; width:100%; max-width:380px; }
            .logo{ margin-bottom:24px; }
            .logo h1{ font-size:24px; letter-spacing:.5px; }
            .logo p{ font-size:10.5px; letter-spacing:2px; }
            .logo-icon-wrap{ width:60px; height:60px; border-radius:16px; margin-bottom:14px; }
            .logo-icon-wrap svg{ width:34px; height:34px; }

            /* Form inputs cómodos para tap */
            .form-group input{ padding:14px 14px 14px 42px; font-size:15px; }
            .form-group label{ font-size:10.5px; }
            .btn{ padding:16px; font-size:13px; }
            .hint{ font-size:11px; padding:9px 10px; }

            /* Banderas más grandes para tap (regla Apple ≥44px) */
            .flag-btn{ width:50px; height:50px; }
            .flag-btn img{ width:46px; height:46px; }

            /* Iconos flotantes: solo unos pocos visibles + más pequeños */
            .float-icon{ font-size:26px !important; opacity:.16 !important; }
            .float-icon.f5,.float-icon.f6,.float-icon.f8,.float-icon.f10,.float-icon.f11,.float-icon.f12{ display:none; }

            /* Spotlights más estrechos para no saturar */
            .spotlight{ width:140px; filter:blur(6px); }
            .spotlight.s1{ left:30%; }
            .spotlight.s3{ left:70%; }

            /* Ecualizador más bajo y espaciado */
            .equalizer{ height:70px; gap:3px; padding:0 10px; opacity:.45; }
            .eq-bar{ width:5px; }

            /* Footer badge compacto */
            .footer-badge{ font-size:9.5px; padding:5px 12px; }
        }

        /* Móvil pequeño (360px y menos): super compacto */
        @media (max-width:360px){
            .login-box{ padding:22px 18px 20px; border-radius:16px; }
            .logo h1{ font-size:21px; }
            .logo-icon-wrap{ width:54px; height:54px; }
            .logo-icon-wrap svg{ width:30px; height:30px; }
            .form-group{ margin-bottom:14px; }
            .float-icon{ font-size:22px !important; }
            .equalizer{ height:55px; }
            .spotlight{ width:110px; }
        }

        /* Landscape mobile: ajustar altura */
        @media (max-height:560px) and (orientation:landscape){
            .login-wrap{ gap:12px; }
            .login-box{ padding:22px 28px 20px; }
            .logo{ margin-bottom:16px; }
            .logo-icon-wrap{ width:48px; height:48px; margin-bottom:8px; }
            .logo-icon-wrap svg{ width:26px; height:26px; }
            .logo h1{ font-size:20px; }
            .logo p{ font-size:9.5px; }
            .form-group{ margin-bottom:12px; }
            .form-group input{ padding:9px 12px 9px 38px; }
            .equalizer{ height:50px; }
        }

        /* Touch hover-state cleanup: en pantallas táctiles desactivar :hover persistente */
        @media (hover: none){
            .btn:hover{ transform:none; box-shadow:0 8px 24px rgba(2,108,223,.4), 0 0 0 1px rgba(255,255,255,.08) inset; }
            .flag-btn:hover{ transform:none; opacity:.55; filter:grayscale(40%); border-color:var(--border); }
            .flag-btn.active{ opacity:1; filter:grayscale(0%); border-color:var(--accent); }
        }

        @media (prefers-reduced-motion: reduce){
            *,*::before,*::after{
                transition-duration:.01ms !important;
                animation-duration:.01ms !important;
                animation-iteration-count:1 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Capas de fondo -->
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Focos de escenario barriendo -->
    <div class="spotlights" aria-hidden="true">
        <div class="spotlight s1"></div>
        <div class="spotlight s2"></div>
        <div class="spotlight s3"></div>
    </div>

    <!-- Estrellas twinkling (generadas por JS para dispersión natural) -->
    <div class="stars" id="starsLayer" aria-hidden="true"></div>

    <!-- Iconos flotantes (tickets, notas musicales, estrellas) — 12 unidades -->
    <div class="float-layer" aria-hidden="true">
        <span class="float-icon f1">🎟️</span>
        <span class="float-icon f2">🎵</span>
        <span class="float-icon f3">🎤</span>
        <span class="float-icon f4">⭐</span>
        <span class="float-icon f5">🎸</span>
        <span class="float-icon f6">🎫</span>
        <span class="float-icon f7">🎭</span>
        <span class="float-icon f8">🎼</span>
        <span class="float-icon f9">🥁</span>
        <span class="float-icon f10">🎹</span>
        <span class="float-icon f11">🪩</span>
        <span class="float-icon f12">🎺</span>
    </div>

    <!-- Confetti cayendo continuamente (generado por JS) -->
    <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

    <!-- Partículas brillantes flotando hacia arriba — 12 unidades -->
    <div class="particles" aria-hidden="true">
        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>
        <span class="particle p9"></span>
        <span class="particle p10"></span>
        <span class="particle p11"></span>
        <span class="particle p12"></span>
    </div>

    <!-- Ecualizador estilo concierto en la base -->
    <div class="equalizer" id="equalizer" aria-hidden="true"></div>

    <div class="login-wrap">
        <form class="login-box" id="loginBox" onsubmit="doLogin(event)">
            <div class="logo">
                <span class="logo-icon-wrap" aria-hidden="true">
                    <!-- Icono SVG de ticket estilizado -->
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M40 16V12C40 10.3431 38.6569 9 37 9H11C9.34315 9 8 10.3431 8 12V16C10.2091 16 12 17.7909 12 20C12 22.2091 10.2091 24 8 24V36C8 37.6569 9.34315 39 11 39H37C38.6569 39 40 37.6569 40 36V24C37.7909 24 36 22.2091 36 20C36 17.7909 37.7909 16 40 16Z"
                              fill="white" fill-opacity=".15" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
                        <path d="M22 14L24 9.5L26 14L31 14.5L27 18L28 23L24 20.5L20 23L21 18L17 14.5L22 14Z"
                              fill="#FFD700" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
                        <line x1="20" y1="28" x2="32" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
                        <line x1="22" y1="32" x2="30" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
                    </svg>
                </span>
                <h1>{{ app_name }}</h1>
                <p>Ticketmaster Multi-Domain</p>
            </div>

            <div class="form-group">
                <label for="username" data-i18n="login.user">Usuario</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="admin">
                    <span class="input-icon" aria-hidden="true">👤</span>
                </div>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="login.password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                    <span class="input-icon" aria-hidden="true">🔒</span>
                </div>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span class="btn-text" data-i18n="login.submit">INICIAR SESIÓN</span>
            </button>

            <div id="err" class="error" role="alert" aria-live="polite"></div>

            <div class="hint">
                <span data-i18n="login.default_hint">Usuario por defecto</span>: <b>admin</b> / <b>admin</b>
            </div>

            <div class="lang-flags">
                <button type="button" class="flag-btn active" data-lang="es" onclick="setLoginLang('es')" title="Español" aria-label="Español">
                    <img src="https://flagcdn.com/w80/es.png" alt="ES" srcset="https://flagcdn.com/w160/es.png 2x" loading="lazy">
                </button>
                <button type="button" class="flag-btn" data-lang="en" onclick="setLoginLang('en')" title="English" aria-label="English">
                    <img src="https://flagcdn.com/w80/gb.png" alt="EN" srcset="https://flagcdn.com/w160/gb.png 2x" loading="lazy">
                </button>
            </div>
        </form>

        <div class="footer-badge">
            <span class="dot"></span>
            <span id="footerStatus">System ready · v1.0.0</span>
        </div>
    </div>

    <script>
        const I18N_LOGIN = {
            "login.user":         {es:"Usuario",                 en:"Username"},
            "login.password":     {es:"Contraseña",              en:"Password"},
            "login.submit":       {es:"INICIAR SESIÓN",          en:"SIGN IN"},
            "login.bad_creds":    {es:"Credenciales incorrectas",en:"Invalid credentials"},
            "login.default_hint": {es:"Usuario por defecto",     en:"Default account"},
            "login.system_ready": {es:"Sistema listo",           en:"System ready"}
        };
        let LANG = localStorage.getItem('tm_lang') ||
                   ((navigator.language||'es').toLowerCase().startsWith('en') ? 'en' : 'es');
        function tt(k){ const e=I18N_LOGIN[k]; return e ? (e[LANG]||e.es||k) : k; }
        function applyLoginI18n(){
            document.documentElement.lang = LANG;
            document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = tt(el.dataset.i18n); });
            document.querySelectorAll('.flag-btn').forEach(b=>{
                b.classList.toggle('active', b.dataset.lang===LANG);
            });
            const fs = document.getElementById('footerStatus');
            if(fs) fs.textContent = tt('login.system_ready') + ' · v1.0.0';
        }
        function setLoginLang(l){ LANG=l; localStorage.setItem('tm_lang', l); applyLoginI18n(); }
        applyLoginI18n();

        // Detección de dispositivo móvil para reducir densidad de animaciones
        // (ahorra batería + evita lag en pantallas táctiles)
        const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches
                         || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ═══ ESTRELLAS TWINKLING (40 desktop · 18 móvil) ═══
        (function genStars(){
            const layer = document.getElementById('starsLayer');
            if(!layer || REDUCED) return;
            const count = IS_MOBILE ? 18 : 40;
            for(let i=0;i<count;i++){
                const s = document.createElement('span');
                s.className = 'star';
                s.style.top = (Math.random()*100)+'%';
                s.style.left = (Math.random()*100)+'%';
                s.style.animationDelay = (Math.random()*3)+'s';
                s.style.animationDuration = (2.5 + Math.random()*2.5)+'s';
                const size = 1.5 + Math.random()*2.5;
                s.style.width = size+'px';
                s.style.height = size+'px';
                layer.appendChild(s);
            }
        })();

        // ═══ ECUALIZADOR (28 barras desktop · 16 móvil) ═══
        (function genEqualizer(){
            const eq = document.getElementById('equalizer');
            if(!eq) return;
            const count = IS_MOBILE ? 16 : 28;
            for(let i=0;i<count;i++){
                const b = document.createElement('span');
                b.className = 'eq-bar';
                b.style.height = (40 + Math.random()*70)+'px';
                b.style.animationDelay = (-Math.random()*1.2)+'s';
                b.style.animationDuration = (0.7 + Math.random()*0.8)+'s';
                eq.appendChild(b);
            }
        })();

        // ═══ CONFETTI INFINITO (tickets, estrellas, notas cayendo) ═══
        // Desktop: 18 inicial + 1/700ms · Móvil: 8 inicial + 1/1400ms
        (function genConfetti(){
            const layer = document.getElementById('confettiLayer');
            if(!layer || REDUCED) return;
            const symbols = ['🎟️','⭐','🎵','✨','🎉','🎊','🎶','💫'];
            const initialCount = IS_MOBILE ? 8 : 18;
            const intervalMs = IS_MOBILE ? 1400 : 700;
            for(let i=0;i<initialCount;i++){
                spawnConfetti(layer, symbols, true);
            }
            setInterval(()=>spawnConfetti(layer, symbols, false), intervalMs);
        })();
        function spawnConfetti(layer, symbols, initial){
            const c = document.createElement('span');
            c.className = 'confetti';
            c.textContent = symbols[Math.floor(Math.random()*symbols.length)];
            c.style.left = (Math.random()*100)+'%';
            // Móvil: tamaños un poco menores (12-22px vs 14-30px)
            const baseSize = IS_MOBILE ? 12 : 14;
            const range = IS_MOBILE ? 10 : 16;
            c.style.fontSize = (baseSize + Math.random()*range)+'px';
            const dur = 8 + Math.random()*10;
            c.style.animationDuration = dur+'s';
            if(initial){
                c.style.animationDelay = (-Math.random()*dur)+'s';
            }
            c.style.filter = `drop-shadow(0 2px 6px rgba(0,0,0,.4)) hue-rotate(${Math.floor(Math.random()*360)}deg)`;
            layer.appendChild(c);
            setTimeout(()=>{ try{ c.remove(); }catch(_){} }, (dur+1)*1000);
        }

        // ═══ Pause animations al ocultar pestaña (ahorra batería) ═══
        document.addEventListener('visibilitychange', ()=>{
            const isHidden = document.visibilityState === 'hidden';
            document.documentElement.style.setProperty('--anim-state', isHidden ? 'paused' : 'running');
        });

        async function doLogin(e){
            e.preventDefault();
            const errBox = document.getElementById('err');
            const btn = document.getElementById('loginBtn');
            const box = document.getElementById('loginBox');
            errBox.textContent = '';
            btn.classList.add('loading');
            btn.disabled = true;

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const r = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({username:u, password:p})
                });
                const j = await r.json();
                if(j.ok){
                    btn.style.background = 'linear-gradient(135deg, #22c55e, #15803d)';
                    btn.querySelector('.btn-text').textContent = '✓';
                    setTimeout(()=>{ location.href = '/'; }, 250);
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    box.classList.remove('shake');
                    void box.offsetWidth;     // force reflow para re-disparar animación
                    box.classList.add('shake');
                    errBox.textContent = tt('login.bad_creds');
                }
            } catch(err) {
                btn.classList.remove('loading');
                btn.disabled = false;
                errBox.textContent = (err && err.message) || tt('login.bad_creds');
            }
        }
    </script>
</body>
</html>
