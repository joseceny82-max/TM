<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/static/favicon.svg?v=2">
    <link rel="shortcut icon" href="/static/favicon.svg?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-deep:#050816;
            --bg:#0a0e1a;
            --card:rgba(15,23,41,.65);
            --border:rgba(2,108,223,.18);
            --border-hi:rgba(2,108,223,.55);
            --accent:#026CDF;
            --accent2:#0052b4;
            --accent-glow:#3b9eff;
            --pink:#d0006f;
            --purple:#7c3aed;
            --text:#e6e8ec;
            --text-muted:#94a3b8;
            --text-dim:#64748b;
            --danger:#ef4444;
            --success:#22c55e;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden}
        body{
            font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg-deep);
            color:var(--text);
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            position:relative;
            -webkit-font-smoothing:antialiased;
        }

        /* ═══ FONDO ANIMADO: gradient mesh + grid ═══ */
        .bg-gradient{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                radial-gradient(ellipse 80% 50% at 20% 30%, rgba(2,108,223,.28), transparent 55%),
                radial-gradient(ellipse 60% 60% at 80% 70%, rgba(208,0,111,.18), transparent 60%),
                radial-gradient(ellipse 100% 80% at 50% 100%, rgba(124,58,237,.16), transparent 60%);
            animation: bgShift 16s ease-in-out infinite alternate;
        }
        @keyframes bgShift{
            0%   { transform:scale(1) translate(0,0); }
            50%  { transform:scale(1.05) translate(-2%,-1%); }
            100% { transform:scale(1) translate(2%,1%); }
        }
        .bg-grid{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background-image:
                linear-gradient(rgba(2,108,223,.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2,108,223,.06) 1px, transparent 1px);
            background-size:60px 60px;
            mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 75%);
            -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 75%);
        }

        /* ═══ TICKETS Y NOTAS MUSICALES FLOTANTES ═══ */
        .float-layer{
            position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
        }
        .float-icon{
            position:absolute;font-size:32px;opacity:.07;
            animation: floatY 18s ease-in-out infinite;
            filter:drop-shadow(0 0 8px rgba(2,108,223,.4));
        }
        .float-icon.f1{top:8%;left:10%;font-size:42px;animation-delay:0s}
        .float-icon.f2{top:18%;left:88%;font-size:36px;animation-delay:-3s}
        .float-icon.f3{top:75%;left:8%;font-size:38px;animation-delay:-6s}
        .float-icon.f4{top:82%;left:90%;font-size:30px;animation-delay:-9s}
        .float-icon.f5{top:45%;left:5%;font-size:28px;animation-delay:-12s}
        .float-icon.f6{top:30%;left:92%;font-size:34px;animation-delay:-15s}
        .float-icon.f7{top:62%;left:15%;font-size:30px;animation-delay:-2s}
        .float-icon.f8{top:12%;left:50%;font-size:28px;animation-delay:-7s}
        @keyframes floatY{
            0%,100% { transform:translateY(0) rotate(-8deg); opacity:.07; }
            50%     { transform:translateY(-30px) rotate(8deg); opacity:.14; }
        }

        /* ═══ PARTÍCULAS FLOTANTES (puntos brillantes) ═══ */
        .particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .particle{
            position:absolute;width:3px;height:3px;border-radius:50%;
            background:rgba(2,108,223,.6);
            box-shadow:0 0 12px rgba(2,108,223,.8), 0 0 24px rgba(2,108,223,.4);
            animation: particleFloat 12s linear infinite;
        }
        .particle.p1{top:90%;left:15%;animation-delay:0s}
        .particle.p2{top:90%;left:35%;animation-delay:-2.5s;background:rgba(208,0,111,.6);box-shadow:0 0 12px rgba(208,0,111,.8)}
        .particle.p3{top:90%;left:55%;animation-delay:-5s}
        .particle.p4{top:90%;left:75%;animation-delay:-7.5s;background:rgba(124,58,237,.6);box-shadow:0 0 12px rgba(124,58,237,.8)}
        .particle.p5{top:90%;left:25%;animation-delay:-3s}
        .particle.p6{top:90%;left:65%;animation-delay:-9s;background:rgba(34,197,94,.6);box-shadow:0 0 12px rgba(34,197,94,.8)}
        .particle.p7{top:90%;left:45%;animation-delay:-11s}
        .particle.p8{top:90%;left:85%;animation-delay:-1s}
        @keyframes particleFloat{
            0%   { transform:translateY(0) scale(.5); opacity:0; }
            10%  { opacity:1; }
            90%  { opacity:.6; }
            100% { transform:translateY(-100vh) scale(1.2); opacity:0; }
        }

        /* ═══ TARJETA DE LOGIN — GLASSMORPHISM ═══ */
        .login-wrap{
            position:relative;z-index:10;
            display:flex;flex-direction:column;align-items:center;gap:22px;
            animation: fadeInUp .8s cubic-bezier(.2,.9,.3,1.2) both;
        }
        @keyframes fadeInUp{
            from{ opacity:0; transform:translateY(28px) scale(.97); }
            to  { opacity:1; transform:translateY(0) scale(1); }
        }

        .login-box{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:20px;
            padding:38px 36px 32px;
            width:420px;max-width:94vw;
            box-shadow:
                0 30px 80px rgba(0,0,0,.6),
                0 0 0 1px rgba(255,255,255,.04) inset,
                0 0 60px rgba(2,108,223,.15);
            backdrop-filter:blur(20px) saturate(150%);
            -webkit-backdrop-filter:blur(20px) saturate(150%);
            position:relative;
            overflow:hidden;
        }
        /* Borde superior con gradiente animado */
        .login-box::before{
            content:'';position:absolute;top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg, transparent, var(--accent), var(--pink), var(--purple), var(--accent), transparent);
            background-size:200% 100%;
            animation: shimmerBorder 4s linear infinite;
        }
        @keyframes shimmerBorder{
            0%   { background-position:0% 0; }
            100% { background-position:-200% 0; }
        }

        /* ═══ LOGO + ICONO ═══ */
        .logo{text-align:center;margin-bottom:30px;position:relative}
        .logo-icon-wrap{
            display:inline-flex;
            width:72px;height:72px;border-radius:20px;
            background:linear-gradient(135deg, var(--accent), var(--accent2));
            align-items:center;justify-content:center;
            margin-bottom:16px;
            box-shadow:
                0 12px 32px rgba(2,108,223,.5),
                0 0 0 1px rgba(255,255,255,.12) inset,
                0 0 40px rgba(2,108,223,.25);
            position:relative;
            animation: logoPulse 3.5s ease-in-out infinite;
        }
        @keyframes logoPulse{
            0%,100% { transform:scale(1); box-shadow:0 12px 32px rgba(2,108,223,.5),0 0 0 1px rgba(255,255,255,.12) inset,0 0 40px rgba(2,108,223,.25); }
            50%     { transform:scale(1.04); box-shadow:0 14px 38px rgba(2,108,223,.65),0 0 0 1px rgba(255,255,255,.18) inset,0 0 60px rgba(2,108,223,.4); }
        }
        .logo-icon-wrap svg{ width:42px;height:42px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }

        .logo h1{
            font-family:'Space Grotesk','Inter',sans-serif;
            font-size:30px;letter-spacing:1px;font-weight:800;
            background:linear-gradient(135deg, #fff 0%, #93c5fd 50%, var(--accent-glow) 100%);
            background-size:200% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;color:transparent;
            animation: textShimmer 4s ease-in-out infinite alternate;
        }
        @keyframes textShimmer{
            0%   { background-position:0% center; }
            100% { background-position:100% center; }
        }
        .logo p{
            color:var(--text-muted);font-size:11.5px;margin-top:4px;
            letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
        }

        /* ═══ FORM ═══ */
        .form-group{margin-bottom:18px;position:relative}
        .form-group label{
            display:block;font-size:11px;color:var(--text-muted);
            margin-bottom:7px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;
        }
        .input-wrap{position:relative}
        .input-wrap .input-icon{
            position:absolute;left:14px;top:50%;transform:translateY(-50%);
            color:var(--text-dim);font-size:16px;pointer-events:none;
            transition:color .25s;
        }
        .form-group input{
            width:100%;
            padding:13px 14px 13px 42px;
            background:rgba(10,14,26,.55);
            border:1px solid var(--border);
            border-radius:11px;
            color:var(--text);font-size:14px;font-family:inherit;
            outline:2px solid transparent;outline-offset:2px;
            transition:border-color .25s, box-shadow .25s, background-color .25s;
        }
        .form-group input::placeholder{color:var(--text-dim)}
        .form-group input:focus{
            border-color:var(--accent);
            background:rgba(10,14,26,.85);
            box-shadow:0 0 0 4px rgba(2,108,223,.18), 0 4px 18px rgba(2,108,223,.12);
        }
        .form-group input:focus + .input-icon,
        .form-group:focus-within .input-icon{ color:var(--accent-glow) }

        /* ═══ BOTÓN PRINCIPAL ═══ */
        .btn{
            position:relative;
            width:100%;padding:14px 16px;
            background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color:#fff;border:none;border-radius:11px;
            font-size:13px;font-weight:700;letter-spacing:1.5px;
            cursor:pointer;margin-top:12px;
            text-transform:uppercase;
            font-family:inherit;
            overflow:hidden;
            transition:transform .25s, box-shadow .25s;
            box-shadow:0 8px 24px rgba(2,108,223,.4), 0 0 0 1px rgba(255,255,255,.08) inset;
        }
        .btn::after{
            content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
            transition:left .6s;
        }
        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 14px 32px rgba(2,108,223,.55), 0 0 0 1px rgba(255,255,255,.15) inset, 0 0 30px rgba(2,108,223,.3);
        }
        .btn:hover::after{ left:100% }
        .btn:active{transform:translateY(0)}
        .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
        .btn:disabled{opacity:.7;cursor:wait}
        .btn.loading .btn-text{visibility:hidden}
        .btn.loading::before{
            content:'';position:absolute;top:50%;left:50%;
            width:20px;height:20px;margin:-10px 0 0 -10px;
            border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        /* ═══ ERROR + SHAKE ═══ */
        .error{
            color:var(--danger);font-size:13px;margin-top:14px;
            text-align:center;min-height:20px;font-weight:500;
        }
        .login-box.shake{ animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
        @keyframes shake{
            10%,90% { transform:translate3d(-1px,0,0); }
            20%,80% { transform:translate3d(2px,0,0); }
            30%,50%,70% { transform:translate3d(-4px,0,0); }
            40%,60%     { transform:translate3d(4px,0,0); }
        }

        /* ═══ HINT ═══ */
        .hint{
            color:var(--text-dim);font-size:11.5px;text-align:center;margin-top:18px;
            padding:10px;background:rgba(2,108,223,.06);
            border:1px solid rgba(2,108,223,.12);
            border-radius:8px;letter-spacing:.3px;
        }
        .hint b{color:var(--text);font-weight:600;font-family:'Space Grotesk',monospace}

        /* ═══ FLAGS LANGUAGE TOGGLE ═══ */
        .lang-flags{
            display:flex;justify-content:center;gap:10px;margin-top:6px;
        }
        .flag-btn{
            background:rgba(15,23,41,.6);
            border:2px solid var(--border);
            cursor:pointer;
            padding:0;
            width:46px;height:46px;
            border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            transition:transform .3s cubic-bezier(.2,.9,.3,1.2), border-color .25s, box-shadow .25s, opacity .25s, filter .25s;
            overflow:hidden;
            opacity:.55;
            filter:grayscale(40%);
            backdrop-filter:blur(10px);
            position:relative;
        }
        .flag-btn img{
            width:42px;height:42px;border-radius:50%;
            object-fit:cover;display:block;pointer-events:none;
        }
        .flag-btn::after{
            content:'';position:absolute;inset:-2px;border-radius:50%;
            background:linear-gradient(135deg, var(--accent), var(--pink));
            opacity:0;transition:opacity .25s;z-index:-1;
        }
        .flag-btn:hover{
            transform:translateY(-3px) scale(1.1);
            opacity:.95;filter:grayscale(0%);
            border-color:var(--border-hi);
        }
        .flag-btn.active{
            opacity:1;filter:grayscale(0%);
            border-color:var(--accent);
            box-shadow:
                0 0 0 4px rgba(2,108,223,.2),
                0 8px 20px rgba(2,108,223,.35);
            transform:scale(1.08);
        }
        .flag-btn:focus-visible{outline:2px solid var(--accent-glow);outline-offset:3px}

        /* ═══ FOOTER BADGE ═══ */
        .footer-badge{
            display:flex;align-items:center;gap:6px;
            font-size:10.5px;color:var(--text-dim);font-weight:500;
            letter-spacing:.4px;text-align:center;
            padding:6px 14px;
            background:rgba(15,23,41,.5);
            border:1px solid var(--border);
            border-radius:30px;
            backdrop-filter:blur(10px);
        }
        .footer-badge .dot{
            width:7px;height:7px;border-radius:50%;background:var(--success);
            box-shadow:0 0 8px var(--success);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse{
            0%,100% { opacity:1; transform:scale(1); }
            50%     { opacity:.6; transform:scale(1.2); }
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width:480px){
            .login-box{padding:30px 24px;border-radius:16px}
            .logo h1{font-size:24px}
            .logo-icon-wrap{width:60px;height:60px}
            .logo-icon-wrap svg{width:34px;height:34px}
            .float-icon{font-size:24px !important}
        }

        @media (prefers-reduced-motion: reduce){
            *,*::before,*::after{
                transition-duration:.01ms !important;
                animation-duration:.01ms !important;
                animation-iteration-count:1 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Capas de fondo -->
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Iconos flotantes (tickets, notas musicales, estrellas) -->
    <div class="float-layer" aria-hidden="true">
        <span class="float-icon f1">🎟️</span>
        <span class="float-icon f2">🎵</span>
        <span class="float-icon f3">🎤</span>
        <span class="float-icon f4">⭐</span>
        <span class="float-icon f5">🎸</span>
        <span class="float-icon f6">🎫</span>
        <span class="float-icon f7">🎭</span>
        <span class="float-icon f8">🎼</span>
    </div>

    <!-- Partículas brillantes flotando hacia arriba -->
    <div class="particles" aria-hidden="true">
        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>
    </div>

    <div class="login-wrap">
        <form class="login-box" id="loginBox" onsubmit="doLogin(event)">
            <div class="logo">
                <span class="logo-icon-wrap" aria-hidden="true">
                    <!-- Icono SVG de ticket estilizado -->
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M40 16V12C40 10.3431 38.6569 9 37 9H11C9.34315 9 8 10.3431 8 12V16C10.2091 16 12 17.7909 12 20C12 22.2091 10.2091 24 8 24V36C8 37.6569 9.34315 39 11 39H37C38.6569 39 40 37.6569 40 36V24C37.7909 24 36 22.2091 36 20C36 17.7909 37.7909 16 40 16Z"
                              fill="white" fill-opacity=".15" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
                        <path d="M22 14L24 9.5L26 14L31 14.5L27 18L28 23L24 20.5L20 23L21 18L17 14.5L22 14Z"
                              fill="#FFD700" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
                        <line x1="20" y1="28" x2="32" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
                        <line x1="22" y1="32" x2="30" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
                    </svg>
                </span>
                <h1>{{ app_name }}</h1>
                <p>Ticketmaster Multi-Domain</p>
            </div>

            <div class="form-group">
                <label for="username" data-i18n="login.user">Usuario</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="admin">
                    <span class="input-icon" aria-hidden="true">👤</span>
                </div>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="login.password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                    <span class="input-icon" aria-hidden="true">🔒</span>
                </div>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span class="btn-text" data-i18n="login.submit">INICIAR SESIÓN</span>
            </button>

            <div id="err" class="error" role="alert" aria-live="polite"></div>

            <div class="hint">
                <span data-i18n="login.default_hint">Usuario por defecto</span>: <b>admin</b> / <b>admin</b>
            </div>

            <div class="lang-flags">
                <button type="button" class="flag-btn active" data-lang="es" onclick="setLoginLang('es')" title="Español" aria-label="Español">
                    <img src="https://flagcdn.com/w80/es.png" alt="ES" srcset="https://flagcdn.com/w160/es.png 2x" loading="lazy">
                </button>
                <button type="button" class="flag-btn" data-lang="en" onclick="setLoginLang('en')" title="English" aria-label="English">
                    <img src="https://flagcdn.com/w80/gb.png" alt="EN" srcset="https://flagcdn.com/w160/gb.png 2x" loading="lazy">
                </button>
            </div>
        </form>

        <div class="footer-badge">
            <span class="dot"></span>
            <span id="footerStatus">System ready · v1.0.0</span>
        </div>
    </div>

    <script>
        const I18N_LOGIN = {
            "login.user":         {es:"Usuario",                 en:"Username"},
            "login.password":     {es:"Contraseña",              en:"Password"},
            "login.submit":       {es:"INICIAR SESIÓN",          en:"SIGN IN"},
            "login.bad_creds":    {es:"Credenciales incorrectas",en:"Invalid credentials"},
            "login.default_hint": {es:"Usuario por defecto",     en:"Default account"},
            "login.system_ready": {es:"Sistema listo",           en:"System ready"}
        };
        let LANG = localStorage.getItem('tm_lang') ||
                   ((navigator.language||'es').toLowerCase().startsWith('en') ? 'en' : 'es');
        function tt(k){ const e=I18N_LOGIN[k]; return e ? (e[LANG]||e.es||k) : k; }
        function applyLoginI18n(){
            document.documentElement.lang = LANG;
            document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = tt(el.dataset.i18n); });
            document.querySelectorAll('.flag-btn').forEach(b=>{
                b.classList.toggle('active', b.dataset.lang===LANG);
            });
            const fs = document.getElementById('footerStatus');
            if(fs) fs.textContent = tt('login.system_ready') + ' · v1.0.0';
        }
        function setLoginLang(l){ LANG=l; localStorage.setItem('tm_lang', l); applyLoginI18n(); }
        applyLoginI18n();

        async function doLogin(e){
            e.preventDefault();
            const errBox = document.getElementById('err');
            const btn = document.getElementById('loginBtn');
            const box = document.getElementById('loginBox');
            errBox.textContent = '';
            btn.classList.add('loading');
            btn.disabled = true;

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const r = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({username:u, password:p})
                });
                const j = await r.json();
                if(j.ok){
                    btn.style.background = 'linear-gradient(135deg, #22c55e, #15803d)';
                    btn.querySelector('.btn-text').textContent = '✓';
                    setTimeout(()=>{ location.href = '/'; }, 250);
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    box.classList.remove('shake');
                    void box.offsetWidth;     // force reflow para re-disparar animación
                    box.classList.add('shake');
                    errBox.textContent = tt('login.bad_creds');
                }
            } catch(err) {
                btn.classList.remove('loading');
                btn.disabled = false;
                errBox.textContent = (err && err.message) || tt('login.bad_creds');
            }
        }
    </script>
</body>
</html>
