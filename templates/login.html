<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/static/favicon.svg?v=2">
    <link rel="shortcut icon" href="/static/favicon.svg?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg-deep:#050816;
            --bg:#0a0e1a;
            --card:rgba(15,23,41,.65);
            --border:rgba(2,108,223,.18);
            --border-hi:rgba(2,108,223,.55);
            --accent:#026CDF;
            --accent2:#0052b4;
            --accent-glow:#3b9eff;
            --pink:#d0006f;
            --purple:#7c3aed;
            --text:#e6e8ec;
            --text-muted:#94a3b8;
            --text-dim:#64748b;
            --danger:#ef4444;
            --success:#22c55e;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden}
        body{
            font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
            background:var(--bg-deep);
            color:var(--text);
            min-height:100vh;
            display:flex;align-items:center;justify-content:center;
            position:relative;
            -webkit-font-smoothing:antialiased;
        }

        /* ═══ FONDO ANIMADO: gradient mesh sobrio profesional ═══ */
        .bg-gradient{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                radial-gradient(ellipse 65% 50% at 25% 30%, rgba(2,108,223,.32), transparent 60%),
                radial-gradient(ellipse 55% 55% at 80% 75%, rgba(2,108,223,.20), transparent 65%),
                radial-gradient(ellipse 50% 45% at 75% 20%, rgba(59,158,255,.15), transparent 65%);
            animation: bgShift 18s ease-in-out infinite alternate;
        }
        @keyframes bgShift{
            0%   { transform:scale(1) translate(0,0); }
            50%  { transform:scale(1.04) translate(-1.5%,-1%); }
            100% { transform:scale(1.02) translate(1%,1.5%); }
        }
        .bg-grid{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background-image:
                linear-gradient(rgba(2,108,223,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(2,108,223,.05) 1px, transparent 1px);
            background-size:64px 64px;
            mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 78%);
            -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 30%, transparent 78%);
        }
        /* Vignette superior + inferior para profundidad cinematic */
        .bg-vignette{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 25%),
                linear-gradient(0deg,   rgba(0,0,0,.45) 0%, transparent 30%);
        }

        /* ═══ ORBES GRANDES DESENFOCADOS (estilo SaaS Linear/Stripe) ═══ */
        .orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .orb{
            position:absolute;border-radius:50%;
            filter:blur(80px);
            opacity:.55;
            animation: orbDrift 24s ease-in-out infinite alternate;
            will-change:transform;
        }
        .orb.o1{ top:-15%; left:-10%; width:520px; height:520px;
                 background:radial-gradient(circle, rgba(2,108,223,.55), transparent 70%);
                 animation-delay:0s; }
        .orb.o2{ bottom:-20%; right:-15%; width:600px; height:600px;
                 background:radial-gradient(circle, rgba(59,158,255,.40), transparent 70%);
                 animation-delay:-8s; animation-duration:28s; }
        .orb.o3{ top:30%; right:-10%; width:380px; height:380px;
                 background:radial-gradient(circle, rgba(2,82,180,.45), transparent 70%);
                 animation-delay:-14s; animation-duration:22s; }
        .orb.o4{ top:50%; left:-15%; width:340px; height:340px;
                 background:radial-gradient(circle, rgba(59,158,255,.35), transparent 70%);
                 animation-delay:-6s; animation-duration:26s; }
        .orb.o5{ top:5%; left:55%; width:280px; height:280px;
                 background:radial-gradient(circle, rgba(2,108,223,.30), transparent 70%);
                 animation-delay:-18s; animation-duration:30s; }
        @keyframes orbDrift{
            0%,100% { transform:translate(0,0) scale(1); }
            50%     { transform:translate(40px,-30px) scale(1.08); }
        }

        /* ═══ PARTICLE NETWORK (canvas con dots conectados por líneas) ═══ */
        #networkCanvas{
            position:fixed;inset:0;z-index:1;pointer-events:none;
            opacity:.42;
            mix-blend-mode:screen;
        }

        /* ═══ CONCENTRIC RING PULSES (radar-style desde abajo centro) ═══ */
        .ring-pulses{
            position:fixed;left:50%;bottom:-40%;z-index:1;
            transform:translateX(-50%);
            pointer-events:none;
        }
        .ring{
            position:absolute;
            left:50%;top:50%;
            border:1.5px solid rgba(59,158,255,.5);
            border-radius:50%;
            transform:translate(-50%,-50%);
            animation: ringPulse 6s ease-out infinite;
            opacity:0;
        }
        .ring.r1{ animation-delay:0s; }
        .ring.r2{ animation-delay:-1.5s; }
        .ring.r3{ animation-delay:-3s; }
        .ring.r4{ animation-delay:-4.5s; }
        @keyframes ringPulse{
            0%   { width:80px; height:80px; opacity:0; border-color:rgba(59,158,255,.7); }
            10%  { opacity:.85; }
            100% { width:1400px; height:1400px; opacity:0; border-color:rgba(2,108,223,.1); }
        }

        /* ═══ SCAN LINES DIAGONALES ═══ */
        .scan-lines{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;mix-blend-mode:screen}
        .scan-line{
            position:absolute;left:-20%;top:50%;
            width:140%;height:1px;
            background:linear-gradient(90deg,
                transparent 0%,
                rgba(59,158,255,0) 20%,
                rgba(59,158,255,.55) 45%,
                rgba(255,255,255,.85) 50%,
                rgba(59,158,255,.55) 55%,
                transparent 80%,
                transparent 100%);
            transform-origin:50% 50%;
            box-shadow:0 0 12px rgba(59,158,255,.5);
            opacity:0;
        }
        .scan-line.sl1{ animation: scanSweep 11s linear infinite; animation-delay:0s; }
        .scan-line.sl2{ animation: scanSweep 14s linear infinite; animation-delay:-5s; }
        .scan-line.sl3{ animation: scanSweep 17s linear infinite; animation-delay:-9s; }
        @keyframes scanSweep{
            0%   { top:-10%;  opacity:0; transform:rotate(-12deg); }
            8%   { opacity:.9; }
            92%  { opacity:.9; }
            100% { top:110%;  opacity:0; transform:rotate(12deg); }
        }

        /* ═══ LÍNEAS DE LUZ (rays sutiles atravesando el viewport) ═══ */
        .light-rays{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;mix-blend-mode:screen;opacity:.5}
        .ray{
            position:absolute;top:-10%;left:50%;
            width:1.5px;height:130vh;
            background:linear-gradient(180deg,
                transparent 0%,
                rgba(59,158,255,.55) 30%,
                rgba(59,158,255,.25) 70%,
                transparent 100%);
            transform-origin:50% 0;
            box-shadow:0 0 8px rgba(59,158,255,.4);
            animation: raySweep 12s ease-in-out infinite;
        }
        .ray.r1{ animation-delay:0s;    left:30%; }
        .ray.r2{ animation-delay:-4s;   left:50%; animation-duration:14s; }
        .ray.r3{ animation-delay:-8s;   left:70%; animation-duration:16s; }
        @keyframes raySweep{
            0%,100% { transform:rotate(-15deg); opacity:.3; }
            50%     { transform:rotate(15deg);  opacity:.7; }
        }

        /* ═══ FORMAS GEOMÉTRICAS SUTILES (anillos + líneas SVG) ═══ */
        .shapes-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .geo-shape{
            position:absolute;
            opacity:.10;
            animation: shapeFloat 24s ease-in-out infinite;
            will-change:transform,opacity;
        }
        .geo-shape.g1{ top:10%; left:8%;  width:120px; height:120px; animation-delay:0s; }
        .geo-shape.g2{ top:18%; left:82%; width:90px;  height:90px;  animation-delay:-4s; opacity:.08; }
        .geo-shape.g3{ top:68%; left:6%;  width:140px; height:140px; animation-delay:-8s; opacity:.07; }
        .geo-shape.g4{ top:78%; left:84%; width:100px; height:100px; animation-delay:-12s; opacity:.09; }
        .geo-shape.g5{ top:42%; left:90%; width:70px;  height:70px;  animation-delay:-6s; opacity:.08; }
        .geo-shape.g6{ top:55%; left:4%;  width:80px;  height:80px;  animation-delay:-16s; opacity:.07; }
        @keyframes shapeFloat{
            0%,100% { transform:translateY(0) rotate(0deg); }
            33%     { transform:translateY(-18px) rotate(60deg); }
            66%     { transform:translateY(12px) rotate(-40deg); }
        }
        .geo-shape svg{ width:100%; height:100%; stroke:rgba(2,108,223,.7); fill:none; stroke-width:1; }

        /* ═══ ESTRELLAS — ahora puntos sutiles tipo "noise field" ═══ */
        .stars{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .star{
            position:absolute;width:2px;height:2px;border-radius:50%;
            background:rgba(255,255,255,.85);
            box-shadow:0 0 4px rgba(255,255,255,.4);
            animation: twinkle 4s ease-in-out infinite;
        }
        @keyframes twinkle{
            0%,100% { opacity:.15; transform:scale(.7); }
            50%     { opacity:.85; transform:scale(1.1); }
        }

        /* ═══ PARTÍCULAS ASCENDENTES (todas azul accent — más sobrio) ═══ */
        .particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .particle{
            position:absolute;width:3px;height:3px;border-radius:50%;
            background:rgba(59,158,255,.6);
            box-shadow:0 0 10px rgba(59,158,255,.6), 0 0 20px rgba(2,108,223,.3);
            animation: particleFloat 14s linear infinite;
        }
        .particle.p1 {top:95%;left:8%;  animation-delay:0s}
        .particle.p2 {top:95%;left:22%; animation-delay:-2s}
        .particle.p3 {top:95%;left:36%; animation-delay:-4s}
        .particle.p4 {top:95%;left:50%; animation-delay:-6s}
        .particle.p5 {top:95%;left:64%; animation-delay:-8s}
        .particle.p6 {top:95%;left:78%; animation-delay:-10s}
        .particle.p7 {top:95%;left:92%; animation-delay:-12s}
        .particle.p8 {top:95%;left:14%; animation-delay:-3s;  width:2px;height:2px}
        .particle.p9 {top:95%;left:44%; animation-delay:-7s;  width:2px;height:2px}
        .particle.p10{top:95%;left:70%; animation-delay:-9s;  width:2px;height:2px}
        @keyframes particleFloat{
            0%   { transform:translateY(0) scale(.5); opacity:0; }
            10%  { opacity:.9; }
            90%  { opacity:.5; }
            100% { transform:translateY(-110vh) scale(1.1); opacity:0; }
        }

        /* ═══ AUDIO WAVE BAR EN BASE — minimalista monocromo ═══ */
        .equalizer{
            position:fixed;left:0;right:0;bottom:0;z-index:1;
            display:flex;justify-content:center;align-items:flex-end;gap:4px;
            height:80px;padding:0 24px;pointer-events:none;
            opacity:.32;
            mask-image:linear-gradient(180deg, transparent 0%, #000 70%);
            -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 70%);
        }
        .eq-bar{
            width:3px;
            background:linear-gradient(180deg, rgba(59,158,255,.9), rgba(2,108,223,.6) 60%, rgba(2,82,180,.3));
            border-radius:2px 2px 0 0;
            animation: eqBeat 1.4s ease-in-out infinite;
            transform-origin:bottom;
        }
        @keyframes eqBeat{
            0%,100% { transform:scaleY(.15); }
            50%     { transform:scaleY(.85); }
        }

        /* ═══ TARJETA DE LOGIN — GLASSMORPHISM ═══ */
        .login-wrap{
            position:relative;z-index:10;
            display:flex;flex-direction:column;align-items:center;gap:22px;
            animation: fadeInUp .8s cubic-bezier(.2,.9,.3,1.2) both;
        }
        @keyframes fadeInUp{
            from{ opacity:0; transform:translateY(28px) scale(.97); }
            to  { opacity:1; transform:translateY(0) scale(1); }
        }

        .login-box{
            background:var(--card);
            border:1px solid var(--border);
            border-radius:20px;
            padding:38px 36px 32px;
            width:420px;max-width:94vw;
            box-shadow:
                0 30px 80px rgba(0,0,0,.6),
                0 0 0 1px rgba(255,255,255,.04) inset,
                0 0 60px rgba(2,108,223,.15);
            backdrop-filter:blur(20px) saturate(150%);
            -webkit-backdrop-filter:blur(20px) saturate(150%);
            position:relative;
            overflow:hidden;
        }
        /* Borde superior con gradiente animado */
        .login-box::before{
            content:'';position:absolute;top:0;left:0;right:0;height:2px;
            background:linear-gradient(90deg, transparent, var(--accent), var(--pink), var(--purple), var(--accent), transparent);
            background-size:200% 100%;
            animation: shimmerBorder 4s linear infinite;
        }
        @keyframes shimmerBorder{
            0%   { background-position:0% 0; }
            100% { background-position:-200% 0; }
        }

        /* ═══ LOGO + ICONO ═══ */
        .logo{text-align:center;margin-bottom:30px;position:relative}
        .logo-icon-wrap{
            display:inline-flex;
            width:72px;height:72px;border-radius:20px;
            background:linear-gradient(135deg, var(--accent), var(--accent2));
            align-items:center;justify-content:center;
            margin-bottom:16px;
            box-shadow:
                0 12px 32px rgba(2,108,223,.5),
                0 0 0 1px rgba(255,255,255,.12) inset,
                0 0 40px rgba(2,108,223,.25);
            position:relative;
            animation: logoPulse 3.5s ease-in-out infinite;
        }
        @keyframes logoPulse{
            0%,100% { transform:scale(1); box-shadow:0 12px 32px rgba(2,108,223,.5),0 0 0 1px rgba(255,255,255,.12) inset,0 0 40px rgba(2,108,223,.25); }
            50%     { transform:scale(1.04); box-shadow:0 14px 38px rgba(2,108,223,.65),0 0 0 1px rgba(255,255,255,.18) inset,0 0 60px rgba(2,108,223,.4); }
        }
        .logo-icon-wrap svg{ width:42px;height:42px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }

        .logo h1{
            font-family:'Space Grotesk','Inter',sans-serif;
            font-size:30px;letter-spacing:1px;font-weight:800;
            background:linear-gradient(135deg, #fff 0%, #93c5fd 50%, var(--accent-glow) 100%);
            background-size:200% auto;
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text;color:transparent;
            animation: textShimmer 4s ease-in-out infinite alternate;
        }
        @keyframes textShimmer{
            0%   { background-position:0% center; }
            100% { background-position:100% center; }
        }
        .logo p{
            color:var(--text-muted);font-size:11.5px;margin-top:4px;
            letter-spacing:2.5px;text-transform:uppercase;font-weight:500;
        }

        /* ═══ FORM ═══ */
        .form-group{margin-bottom:18px;position:relative}
        .form-group label{
            display:block;font-size:11px;color:var(--text-muted);
            margin-bottom:7px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600;
        }
        .input-wrap{position:relative}
        .input-wrap .input-icon{
            position:absolute;left:14px;top:50%;transform:translateY(-50%);
            color:var(--text-dim);pointer-events:none;
            display:inline-flex;align-items:center;justify-content:center;
            transition:color .25s;
        }
        .input-wrap .input-icon svg{display:block}
        .form-group input{
            width:100%;
            padding:13px 14px 13px 42px;
            background:rgba(10,14,26,.55);
            border:1px solid var(--border);
            border-radius:11px;
            color:var(--text);font-size:14px;font-family:inherit;
            outline:2px solid transparent;outline-offset:2px;
            transition:border-color .25s, box-shadow .25s, background-color .25s;
        }
        .form-group input::placeholder{color:var(--text-dim)}
        .form-group input:focus{
            border-color:var(--accent);
            background:rgba(10,14,26,.85);
            box-shadow:0 0 0 4px rgba(2,108,223,.18), 0 4px 18px rgba(2,108,223,.12);
        }
        .form-group input:focus + .input-icon,
        .form-group:focus-within .input-icon{ color:var(--accent-glow) }

        /* ═══ BOTÓN PRINCIPAL ═══ */
        .btn{
            position:relative;
            width:100%;padding:14px 16px;
            background:linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color:#fff;border:none;border-radius:11px;
            font-size:13px;font-weight:700;letter-spacing:1.5px;
            cursor:pointer;margin-top:12px;
            text-transform:uppercase;
            font-family:inherit;
            overflow:hidden;
            transition:transform .25s, box-shadow .25s;
            box-shadow:0 8px 24px rgba(2,108,223,.4), 0 0 0 1px rgba(255,255,255,.08) inset;
        }
        .btn::after{
            content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
            transition:left .6s;
        }
        .btn:hover{
            transform:translateY(-2px);
            box-shadow:0 14px 32px rgba(2,108,223,.55), 0 0 0 1px rgba(255,255,255,.15) inset, 0 0 30px rgba(2,108,223,.3);
        }
        .btn:hover::after{ left:100% }
        .btn:active{transform:translateY(0)}
        .btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
        .btn:disabled{opacity:.7;cursor:wait}
        .btn.loading .btn-text{visibility:hidden}
        .btn.loading::before{
            content:'';position:absolute;top:50%;left:50%;
            width:20px;height:20px;margin:-10px 0 0 -10px;
            border:2.5px solid rgba(255,255,255,.25);border-top-color:#fff;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        /* ═══ ERROR + SHAKE ═══ */
        .error{
            color:var(--danger);font-size:13px;margin-top:14px;
            text-align:center;min-height:20px;font-weight:500;
        }
        .login-box.shake{ animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
        @keyframes shake{
            10%,90% { transform:translate3d(-1px,0,0); }
            20%,80% { transform:translate3d(2px,0,0); }
            30%,50%,70% { transform:translate3d(-4px,0,0); }
            40%,60%     { transform:translate3d(4px,0,0); }
        }

        /* ═══ HINT ═══ */
        .hint{
            color:var(--text-dim);font-size:11.5px;text-align:center;margin-top:18px;
            padding:10px;background:rgba(2,108,223,.06);
            border:1px solid rgba(2,108,223,.12);
            border-radius:8px;letter-spacing:.3px;
        }
        .hint b{color:var(--text);font-weight:600;font-family:'Space Grotesk',monospace}

        /* ═══ FLAGS LANGUAGE TOGGLE ═══ */
        .lang-flags{
            display:flex;justify-content:center;gap:10px;margin-top:6px;
        }
        .flag-btn{
            background:rgba(15,23,41,.6);
            border:2px solid var(--border);
            cursor:pointer;
            padding:0;
            width:46px;height:46px;
            border-radius:50%;
            display:inline-flex;align-items:center;justify-content:center;
            transition:transform .3s cubic-bezier(.2,.9,.3,1.2), border-color .25s, box-shadow .25s, opacity .25s, filter .25s;
            overflow:hidden;
            opacity:.55;
            filter:grayscale(40%);
            backdrop-filter:blur(10px);
            position:relative;
        }
        .flag-btn img{
            width:42px;height:42px;border-radius:50%;
            object-fit:cover;display:block;pointer-events:none;
        }
        .flag-btn::after{
            content:'';position:absolute;inset:-2px;border-radius:50%;
            background:linear-gradient(135deg, var(--accent), var(--pink));
            opacity:0;transition:opacity .25s;z-index:-1;
        }
        .flag-btn:hover{
            transform:translateY(-3px) scale(1.1);
            opacity:.95;filter:grayscale(0%);
            border-color:var(--border-hi);
        }
        .flag-btn.active{
            opacity:1;filter:grayscale(0%);
            border-color:var(--accent);
            box-shadow:
                0 0 0 4px rgba(2,108,223,.2),
                0 8px 20px rgba(2,108,223,.35);
            transform:scale(1.08);
        }
        .flag-btn:focus-visible{outline:2px solid var(--accent-glow);outline-offset:3px}

        /* ═══ FOOTER BADGE ═══ */
        .footer-badge{
            display:flex;align-items:center;gap:6px;
            font-size:10.5px;color:var(--text-dim);font-weight:500;
            letter-spacing:.4px;text-align:center;
            padding:6px 14px;
            background:rgba(15,23,41,.5);
            border:1px solid var(--border);
            border-radius:30px;
            backdrop-filter:blur(10px);
        }
        .footer-badge .dot{
            width:7px;height:7px;border-radius:50%;background:var(--success);
            box-shadow:0 0 8px var(--success);
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse{
            0%,100% { opacity:1; transform:scale(1); }
            50%     { opacity:.6; transform:scale(1.2); }
        }

        /* ═══ RESPONSIVE — móvil + tablet con escalado completo ═══ */
        /* Soporte iOS dynamic viewport (100vh incluye toolbar de Safari) */
        @supports (height: 100dvh){
            html,body{ min-height:100dvh; }
        }
        body{
            padding: env(safe-area-inset-top) env(safe-area-inset-right)
                     env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Tablet (768px y menos): ajuste medio */
        @media (max-width:768px){
            .login-box{ width:380px; padding:32px 28px; }
            .float-icon{ font-size:32px !important; }
            .float-icon.f1,.float-icon.f3{ font-size:38px !important; }
            .float-icon.f2,.float-icon.f6{ font-size:34px !important; }
            .spotlight{ width:200px; }
            .equalizer{ height:90px; gap:4px; }
            .eq-bar{ width:6px; }
        }

        /* Móvil (480px y menos): compacto + density reducido */
        @media (max-width:480px){
            .login-box{
                width:100%;
                padding:26px 22px 24px;
                border-radius:18px;
            }
            .login-wrap{ gap:18px; padding:0 14px; width:100%; max-width:380px; }
            .logo{ margin-bottom:24px; }
            .logo h1{ font-size:24px; letter-spacing:.5px; }
            .logo p{ font-size:10.5px; letter-spacing:2px; }
            .logo-icon-wrap{ width:60px; height:60px; border-radius:16px; margin-bottom:14px; }
            .logo-icon-wrap svg{ width:34px; height:34px; }

            /* Form inputs cómodos para tap */
            .form-group input{ padding:14px 14px 14px 42px; font-size:15px; }
            .form-group label{ font-size:10.5px; }
            .btn{ padding:16px; font-size:13px; }
            .hint{ font-size:11px; padding:9px 10px; }

            /* Banderas más grandes para tap (regla Apple ≥44px) */
            .flag-btn{ width:50px; height:50px; }
            .flag-btn img{ width:46px; height:46px; }

            /* Iconos flotantes: solo unos pocos visibles + más pequeños */
            .float-icon{ font-size:26px !important; opacity:.16 !important; }
            .float-icon.f5,.float-icon.f6,.float-icon.f8,.float-icon.f10,.float-icon.f11,.float-icon.f12{ display:none; }

            /* Spotlights más estrechos para no saturar */
            .spotlight{ width:140px; filter:blur(6px); }
            .spotlight.s1{ left:30%; }
            .spotlight.s3{ left:70%; }

            /* Ecualizador más bajo y espaciado */
            .equalizer{ height:70px; gap:3px; padding:0 10px; opacity:.45; }
            .eq-bar{ width:5px; }

            /* Footer badge compacto */
            .footer-badge{ font-size:9.5px; padding:5px 12px; }
        }

        /* Móvil pequeño (360px y menos): super compacto */
        @media (max-width:360px){
            .login-box{ padding:22px 18px 20px; border-radius:16px; }
            .logo h1{ font-size:21px; }
            .logo-icon-wrap{ width:54px; height:54px; }
            .logo-icon-wrap svg{ width:30px; height:30px; }
            .form-group{ margin-bottom:14px; }
            .float-icon{ font-size:22px !important; }
            .equalizer{ height:55px; }
            .spotlight{ width:110px; }
        }

        /* Landscape mobile: ajustar altura */
        @media (max-height:560px) and (orientation:landscape){
            .login-wrap{ gap:12px; }
            .login-box{ padding:22px 28px 20px; }
            .logo{ margin-bottom:16px; }
            .logo-icon-wrap{ width:48px; height:48px; margin-bottom:8px; }
            .logo-icon-wrap svg{ width:26px; height:26px; }
            .logo h1{ font-size:20px; }
            .logo p{ font-size:9.5px; }
            .form-group{ margin-bottom:12px; }
            .form-group input{ padding:9px 12px 9px 38px; }
            .equalizer{ height:50px; }
        }

        /* Touch hover-state cleanup: en pantallas táctiles desactivar :hover persistente */
        @media (hover: none){
            .btn:hover{ transform:none; box-shadow:0 8px 24px rgba(2,108,223,.4), 0 0 0 1px rgba(255,255,255,.08) inset; }
            .flag-btn:hover{ transform:none; opacity:.55; filter:grayscale(40%); border-color:var(--border); }
            .flag-btn.active{ opacity:1; filter:grayscale(0%); border-color:var(--accent); }
        }

        @media (prefers-reduced-motion: reduce){
            *,*::before,*::after{
                transition-duration:.01ms !important;
                animation-duration:.01ms !important;
                animation-iteration-count:1 !important;
            }
        }
    </style>
</head>
<body>

    <!-- Capas de fondo SaaS profesional -->
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>

    <!-- Orbes desenfocados gigantes (estilo Linear/Stripe) -->
    <div class="orbs" aria-hidden="true">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
        <div class="orb o4"></div>
        <div class="orb o5"></div>
    </div>

    <!-- Particle network: dots conectados por líneas (canvas) -->
    <canvas id="networkCanvas" aria-hidden="true"></canvas>

    <!-- Concentric ring pulses: ondas tipo radar emanando del centro inferior -->
    <div class="ring-pulses" aria-hidden="true">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>
        <div class="ring r4"></div>
    </div>

    <!-- Scan lines diagonales: barridos horizontales rotando -->
    <div class="scan-lines" aria-hidden="true">
        <div class="scan-line sl1"></div>
        <div class="scan-line sl2"></div>
        <div class="scan-line sl3"></div>
    </div>

    <!-- Rays de luz verticales sutiles -->
    <div class="light-rays" aria-hidden="true">
        <div class="ray r1"></div>
        <div class="ray r2"></div>
        <div class="ray r3"></div>
    </div>

    <!-- Formas geométricas SVG (anillos, hexágonos, líneas onda) -->
    <div class="shapes-layer" aria-hidden="true">
        <div class="geo-shape g1">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45"/>
                <circle cx="50" cy="50" r="32"/>
                <circle cx="50" cy="50" r="18"/>
            </svg>
        </div>
        <div class="geo-shape g2">
            <svg viewBox="0 0 100 100">
                <polygon points="50,5 90,28 90,72 50,95 10,72 10,28"/>
                <polygon points="50,22 75,36 75,64 50,78 25,64 25,36"/>
            </svg>
        </div>
        <div class="geo-shape g3">
            <svg viewBox="0 0 200 100" preserveAspectRatio="none">
                <path d="M0,50 Q25,10 50,50 T100,50 T150,50 T200,50" stroke-width="1.2"/>
                <path d="M0,60 Q25,30 50,60 T100,60 T150,60 T200,60" stroke-width="1" opacity=".6"/>
                <path d="M0,40 Q25,70 50,40 T100,40 T150,40 T200,40" stroke-width="1" opacity=".6"/>
            </svg>
        </div>
        <div class="geo-shape g4">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45"/>
                <line x1="50" y1="5" x2="50" y2="95" stroke-width=".8"/>
                <line x1="5" y1="50" x2="95" y2="50" stroke-width=".8"/>
                <circle cx="50" cy="50" r="6" fill="rgba(2,108,223,.4)"/>
            </svg>
        </div>
        <div class="geo-shape g5">
            <svg viewBox="0 0 100 100">
                <rect x="10" y="10" width="80" height="80" rx="10"/>
                <rect x="22" y="22" width="56" height="56" rx="6"/>
                <rect x="34" y="34" width="32" height="32" rx="3"/>
            </svg>
        </div>
        <div class="geo-shape g6">
            <svg viewBox="0 0 100 100">
                <polygon points="50,8 92,50 50,92 8,50"/>
                <polygon points="50,28 72,50 50,72 28,50"/>
            </svg>
        </div>
    </div>

    <!-- Estrellas / noise field (generadas por JS) -->
    <div class="stars" id="starsLayer" aria-hidden="true"></div>

    <!-- Partículas ascendentes monocromas -->
    <div class="particles" aria-hidden="true">
        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>
        <span class="particle p5"></span>
        <span class="particle p6"></span>
        <span class="particle p7"></span>
        <span class="particle p8"></span>
        <span class="particle p9"></span>
        <span class="particle p10"></span>
    </div>

    <!-- Audio wave bar minimalista en la base -->
    <div class="equalizer" id="equalizer" aria-hidden="true"></div>

    <div class="login-wrap">
        <form class="login-box" id="loginBox" onsubmit="doLogin(event)">
            <div class="logo">
                <span class="logo-icon-wrap" aria-hidden="true">
                    <!-- Icono SVG de ticket estilizado -->
                    <svg viewBox="0 0 48 48" fill="none">
                        <path d="M40 16V12C40 10.3431 38.6569 9 37 9H11C9.34315 9 8 10.3431 8 12V16C10.2091 16 12 17.7909 12 20C12 22.2091 10.2091 24 8 24V36C8 37.6569 9.34315 39 11 39H37C38.6569 39 40 37.6569 40 36V24C37.7909 24 36 22.2091 36 20C36 17.7909 37.7909 16 40 16Z"
                              fill="white" fill-opacity=".15" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
                        <path d="M22 14L24 9.5L26 14L31 14.5L27 18L28 23L24 20.5L20 23L21 18L17 14.5L22 14Z"
                              fill="#FFD700" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
                        <line x1="20" y1="28" x2="32" y2="28" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
                        <line x1="22" y1="32" x2="30" y2="32" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".5"/>
                    </svg>
                </span>
                <h1>{{ app_name }}</h1>
                <p>Ticketmaster Multi-Domain</p>
            </div>

            <div class="form-group">
                <label for="username" data-i18n="login.user">Usuario</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus placeholder="admin">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="login.password">Contraseña</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                    <span class="input-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn" id="loginBtn">
                <span class="btn-text" data-i18n="login.submit">INICIAR SESIÓN</span>
            </button>

            <div id="err" class="error" role="alert" aria-live="polite"></div>

            <div class="hint">
                <span data-i18n="login.default_hint">Usuario por defecto</span>: <b>admin</b> / <b>admin</b>
            </div>

            <div class="lang-flags">
                <button type="button" class="flag-btn active" data-lang="es" onclick="setLoginLang('es')" title="Español" aria-label="Español">
                    <img src="https://flagcdn.com/w80/es.png" alt="ES" srcset="https://flagcdn.com/w160/es.png 2x" loading="lazy">
                </button>
                <button type="button" class="flag-btn" data-lang="en" onclick="setLoginLang('en')" title="English" aria-label="English">
                    <img src="https://flagcdn.com/w80/gb.png" alt="EN" srcset="https://flagcdn.com/w160/gb.png 2x" loading="lazy">
                </button>
            </div>
        </form>

        <div class="footer-badge">
            <span class="dot"></span>
            <span id="footerStatus">System ready · v1.0.0</span>
        </div>
    </div>

    <script>
        const I18N_LOGIN = {
            "login.user":         {es:"Usuario",                 en:"Username"},
            "login.password":     {es:"Contraseña",              en:"Password"},
            "login.submit":       {es:"INICIAR SESIÓN",          en:"SIGN IN"},
            "login.bad_creds":    {es:"Credenciales incorrectas",en:"Invalid credentials"},
            "login.default_hint": {es:"Usuario por defecto",     en:"Default account"},
            "login.system_ready": {es:"Sistema listo",           en:"System ready"}
        };
        let LANG = localStorage.getItem('tm_lang') ||
                   ((navigator.language||'es').toLowerCase().startsWith('en') ? 'en' : 'es');
        function tt(k){ const e=I18N_LOGIN[k]; return e ? (e[LANG]||e.es||k) : k; }
        function applyLoginI18n(){
            document.documentElement.lang = LANG;
            document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = tt(el.dataset.i18n); });
            document.querySelectorAll('.flag-btn').forEach(b=>{
                b.classList.toggle('active', b.dataset.lang===LANG);
            });
            const fs = document.getElementById('footerStatus');
            if(fs) fs.textContent = tt('login.system_ready') + ' · v1.0.0';
        }
        function setLoginLang(l){ LANG=l; localStorage.setItem('tm_lang', l); applyLoginI18n(); }
        applyLoginI18n();

        // Detección de dispositivo móvil — densidad reducida para ahorro batería
        const IS_MOBILE = window.matchMedia('(max-width: 768px)').matches
                         || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ═══ NOISE FIELD (puntos sutiles dispersos como starfield) ═══
        // Desktop: 50 puntos · Móvil: 24 · Reduced motion: skip
        (function genStars(){
            const layer = document.getElementById('starsLayer');
            if(!layer || REDUCED) return;
            const count = IS_MOBILE ? 24 : 50;
            for(let i=0;i<count;i++){
                const s = document.createElement('span');
                s.className = 'star';
                s.style.top = (Math.random()*100)+'%';
                s.style.left = (Math.random()*100)+'%';
                s.style.animationDelay = (Math.random()*4)+'s';
                s.style.animationDuration = (3 + Math.random()*3)+'s';
                const size = 1 + Math.random()*1.8;
                s.style.width = size+'px';
                s.style.height = size+'px';
                layer.appendChild(s);
            }
        })();

        // ═══ AUDIO WAVE BAR (32 desktop · 18 móvil) — minimalista monocromo ═══
        (function genEqualizer(){
            const eq = document.getElementById('equalizer');
            if(!eq) return;
            const count = IS_MOBILE ? 18 : 32;
            for(let i=0;i<count;i++){
                const b = document.createElement('span');
                b.className = 'eq-bar';
                b.style.height = (30 + Math.random()*45)+'px';
                b.style.animationDelay = (-Math.random()*1.6)+'s';
                b.style.animationDuration = (1.0 + Math.random()*0.8)+'s';
                eq.appendChild(b);
            }
        })();

        // ═══ PARTICLE NETWORK CANVAS ═══
        // Estilo fintech/SaaS premium: dots flotando + líneas que conectan
        // los más cercanos. Movimiento lento, monocromo azul accent.
        // Desktop: 70 nodos · Móvil: 30 · Reduced motion: skip
        (function particleNetwork(){
            if(REDUCED) return;
            const canvas = document.getElementById('networkCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const N = IS_MOBILE ? 30 : 70;
            const MAX_DIST = IS_MOBILE ? 120 : 160;
            let nodes = [];

            function resize(){
                canvas.width  = window.innerWidth  * dpr;
                canvas.height = window.innerHeight * dpr;
                canvas.style.width  = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';
                ctx.scale(dpr, dpr);
            }
            function init(){
                nodes = [];
                for(let i=0;i<N;i++){
                    nodes.push({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        r: 1.2 + Math.random() * 1.4,
                    });
                }
            }
            function step(){
                ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                // Mover + dibujar nodos
                for(const n of nodes){
                    n.x += n.vx; n.y += n.vy;
                    if(n.x < 0 || n.x > window.innerWidth) n.vx *= -1;
                    if(n.y < 0 || n.y > window.innerHeight) n.vy *= -1;
                    ctx.beginPath();
                    ctx.fillStyle = 'rgba(59,158,255,.85)';
                    ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
                    ctx.fill();
                }
                // Conectar nodos cercanos con líneas de opacidad gradual
                for(let i=0;i<nodes.length;i++){
                    for(let j=i+1;j<nodes.length;j++){
                        const dx = nodes[i].x - nodes[j].x;
                        const dy = nodes[i].y - nodes[j].y;
                        const dist = Math.hypot(dx, dy);
                        if(dist < MAX_DIST){
                            const alpha = (1 - dist/MAX_DIST) * 0.5;
                            ctx.strokeStyle = `rgba(59,158,255,${alpha.toFixed(3)})`;
                            ctx.lineWidth = 0.7;
                            ctx.beginPath();
                            ctx.moveTo(nodes[i].x, nodes[i].y);
                            ctx.lineTo(nodes[j].x, nodes[j].y);
                            ctx.stroke();
                        }
                    }
                }
                rafId = requestAnimationFrame(step);
            }
            let rafId = null;
            resize(); init(); step();
            window.addEventListener('resize', ()=>{ resize(); init(); }, {passive:true});
            // Pause cuando pestaña oculta (ahorro batería)
            document.addEventListener('visibilitychange', ()=>{
                if(document.visibilityState === 'hidden'){
                    if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
                } else if(!rafId){
                    step();
                }
            });
        })();

        // ═══ Ajustar tamaño del ring-pulses container según viewport ═══
        (function sizeRingContainer(){
            const c = document.querySelector('.ring-pulses');
            if(!c) return;
            // El container debe ser tan grande como el ring max para no clip
            c.style.width  = '1400px';
            c.style.height = '1400px';
        })();

        // ═══ Pause animations CSS al ocultar pestaña (ahorra batería) ═══
        document.addEventListener('visibilitychange', ()=>{
            const isHidden = document.visibilityState === 'hidden';
            document.documentElement.style.setProperty('--anim-state', isHidden ? 'paused' : 'running');
        });

        async function doLogin(e){
            e.preventDefault();
            const errBox = document.getElementById('err');
            const btn = document.getElementById('loginBtn');
            const box = document.getElementById('loginBox');
            errBox.textContent = '';
            btn.classList.add('loading');
            btn.disabled = true;

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            try {
                const r = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({username:u, password:p})
                });
                const j = await r.json();
                if(j.ok){
                    btn.style.background = 'linear-gradient(135deg, #22c55e, #15803d)';
                    btn.querySelector('.btn-text').textContent = '✓';
                    setTimeout(()=>{ location.href = '/'; }, 250);
                } else {
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    box.classList.remove('shake');
                    void box.offsetWidth;     // force reflow para re-disparar animación
                    box.classList.add('shake');
                    errBox.textContent = tt('login.bad_creds');
                }
            } catch(err) {
                btn.classList.remove('loading');
                btn.disabled = false;
                errBox.textContent = (err && err.message) || tt('login.bad_creds');
            }
        }
    </script>
</body>
</html>
