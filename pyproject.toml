[project]
name = "tm-perros"
version = "1.0.0"
description = "Ticketmaster multi-domain dashboard + bot toolkit"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "_*.py",                  # scripts utilitarios
    "tests/",                 # tests use pytest patterns
    "__pycache__/",
    ".venv/", "venv/",
    "logs/", "backups/", "datos/",
    "**/*.bak.*", "**/*.rescue.*", "**/*.bak_*",
    "captcha_training_export/",  # export externo (Roboflow), no lintear
    "data/", "secrets/",
]

[tool.ruff.lint]
# Empezamos conservador — solo errores graves de seguridad / sintaxis
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, etc)
    "W",   # pycodestyle warnings
    "B",   # bugbear (mutable defaults, broad except)
    "S",   # bandit (security)
]
ignore = [
    "E501",  # line too long (sólo warnings — no critical)
    "E402",  # module-level import not at top
    "B008",  # function call as default arg (json_atomic patterns)
    "B009",  # getattr(x, "y") - sometimes needed
    "S101",  # assert (usado en self-tests)
    "S311",  # random for non-cryptographic
    "S110",  # try/except/pass (defensive code patterns)
    "S112",  # try/except/continue (defensive code patterns)
    "S603",  # subprocess without shell (we use lists)
    "S607",  # subprocess with partial path
    "F401",  # unused imports — too many warnings on dashboard.py
    "F841",  # unused local variables
    "F541",  # f-string without placeholders
    "B904",  # raise from inside except (legacy code)
    "B007",  # unused loop variable
]

[tool.ruff.lint.per-file-ignores]
"dashboard.py" = ["E", "F", "W", "B"]   # demasiado grande para lint estricto
"i18n.py" = ["E", "F", "W"]             # generated/large dict file
"templates/*" = ["ALL"]                  # HTML embedded JS

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests slow (e.g. real network)",
    "e2e: end-to-end (Playwright)",
]
