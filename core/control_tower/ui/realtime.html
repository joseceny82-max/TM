<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TM Control Tower — Realtime</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0a0e1a; color: #e6edf3;
       font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 13px; line-height: 1.4; }
.top { padding: 14px 20px; background: linear-gradient(135deg,#026CDF,#0052b4);
       display: flex; align-items: center; gap: 14px; }
.top h1 { margin: 0; font-size: 18px; }
.top .sub { color: rgba(255,255,255,.75); font-size: 12px; }
.top .nav { margin-left: auto; display: flex; gap: 12px; }
.top .nav a { color: rgba(255,255,255,.85); text-decoration: none; padding: 4px 10px;
              border-radius: 4px; background: rgba(0,0,0,.2); font-size: 11px; }
.top .nav a.active { background: rgba(255,255,255,.2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
.dot.off { background: #ef4444; }
.top .status { display: flex; gap: 8px; align-items: center; font-size: 12px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px; min-height: calc(100vh - 56px); }
.card { background: #131826; border: 1px solid #2a3346; border-radius: 6px; padding: 14px; }
.card h3 { margin: 0 0 10px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: #8b95a8; }

/* State panel */
.state-big { font-size: 32px; font-weight: 800; text-align: center; padding: 14px;
             background: #1a2235; border-radius: 6px; margin: 6px 0; }
.state-big.setup    { color: #64748b; border: 2px solid #64748b; }
.state-big.browsing { color: #06b6d4; border: 2px solid #06b6d4; }
.state-big.login    { color: #f59e0b; border: 2px solid #f59e0b; }
.state-big.checkout { color: #7c3aed; border: 2px solid #7c3aed; }
.state-big.exit     { color: #ef4444; border: 2px solid #ef4444; }
.prev { text-align: center; color: #8b95a8; font-size: 11px; margin-top: 6px; }
.hist { font-size: 11px; max-height: 160px; overflow-y: auto; }
.hist .item { padding: 4px 6px; border-bottom: 1px solid #2a3346; }
.hist .arrow { color: #8b95a8; }

/* Health gauge */
.gauge { text-align: center; padding: 8px 0; }
.gauge .num { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
.gauge .verd { font-size: 11px; color: #8b95a8; letter-spacing: 1.2px; text-transform: uppercase; }
.gauge .num.healthy   { color: #22c55e; }
.gauge .num.degraded  { color: #f59e0b; }
.gauge .num.unhealthy { color: #f97316; }
.gauge .num.critical  { color: #ef4444; }
.bar { height: 8px; background: #1a2235; border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar .fill { height: 100%; background: linear-gradient(90deg, #ef4444, #f59e0b, #06b6d4, #22c55e);
             transition: width .3s ease; }

/* Drift */
.drift-stat { font-size: 18px; font-weight: 700; text-align: center; padding: 6px 0; }
.drift-stat.zero { color: #22c55e; }
.drift-stat.has { color: #ef4444; }
.drift-list { font-size: 11px; max-height: 180px; overflow-y: auto; }
.drift-item { padding: 6px 8px; border-left: 3px solid #ef4444; margin-bottom: 4px;
              background: rgba(239,68,68,.08); border-radius: 2px; }
.drift-item .kind { font-weight: 700; color: #ef4444; }
.drift-item .detail { color: #8b95a8; font-size: 10px; margin-top: 2px; }

/* Loop detector */
.loop-item { display: flex; justify-content: space-between; padding: 5px 8px;
             background: #1a2235; border-radius: 3px; margin-bottom: 3px; }
.loop-item .count { font-weight: 700; }
.loop-item .count.cold { color: #22c55e; }
.loop-item .count.warm { color: #f59e0b; }
.loop-item .count.hot { color: #f97316; }
.loop-item .count.danger { color: #ef4444; }

.empty { color: #8b95a8; padding: 8px 0; text-align: center; font-size: 11px; }

/* Stream */
.stream { font-size: 11px; max-height: 380px; overflow-y: auto;
          background: #0a0e1a; padding: 8px; border-radius: 4px; border: 1px solid #2a3346; }
.evt { padding: 1px 4px; display: flex; gap: 8px; }
.evt .ts { color: #8b95a8; width: 70px; flex-shrink: 0; }
.evt .kind { width: 80px; flex-shrink: 0; font-weight: 700; }
.evt .state { color: #8b95a8; width: 60px; flex-shrink: 0; }
.evt.STATE         .kind { color: #22c55e; }
.evt.STATE         { background: rgba(34,197,94,.05); }
.evt.ACTION        .kind { color: #06b6d4; }
.evt.OBSERVABILITY .kind { color: #8b95a8; }
.evt.OBSERVABILITY { opacity: .75; }
.evt.NOISE         .kind { color: #64748b; }
.evt.NOISE         { opacity: .4; }
</style>
</head>
<body>
<div class="top">
  <h1>TM Control Tower</h1>
  <span class="sub">Realtime · 4 paneles</span>
  <div class="nav">
    <a href="/">MVP</a>
    <a href="/realtime" class="active">Realtime</a>
    <a href="/control">Control</a>
    <a href="/tower">Industrial</a>
  </div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="conn">connecting...</span>
  </div>
</div>

<div class="grid">

  <!-- 1. State live -->
  <div class="card">
    <h3>State live</h3>
    <div class="state-big" id="state">—</div>
    <div class="prev" id="prev">previous: —</div>
    <div class="hist" id="hist"></div>
  </div>

  <!-- 2. Health gauge -->
  <div class="card">
    <h3>Health gauge</h3>
    <div class="gauge">
      <div class="num" id="score">—</div>
      <div class="verd" id="verd">—</div>
    </div>
    <div class="bar"><div class="fill" id="fill" style="width:0%"></div></div>
    <div class="prev" style="margin-top:8px;">
      events: <span id="evcount">0</span> · elapsed: <span id="elapsed">0s</span>
    </div>
  </div>

  <!-- 3. Drift panel -->
  <div class="card">
    <h3>Drift panel</h3>
    <div class="drift-stat zero" id="drift-stat">0 drifts</div>
    <div class="drift-list" id="drift-list">
      <div class="empty">No drifts</div>
    </div>
  </div>

  <!-- 4. Loop detector -->
  <div class="card">
    <h3>Loop detector</h3>
    <div id="loops">
      <div class="empty">No active loops</div>
    </div>
  </div>

  <!-- bottom: stream -->
  <div class="card" style="grid-column: 1 / 3;">
    <h3>Event stream · live</h3>
    <div class="stream" id="stream"></div>
  </div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  function html(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function renderEvent(rec) {
    const kind = rec.kind || "UNKNOWN";
    const ts = (rec.ts||"").substring(11,19);
    const evt = rec.event || "?";
    const state = rec.state || "—";
    const d = document.createElement("div");
    d.className = "evt " + kind;
    d.innerHTML = `<span class="ts">${ts}</span><span class="kind">${kind.padEnd(13)}</span>` +
                  `<span class="state">${state}</span><span>${html(evt)}</span>`;
    const s = $("stream");
    s.appendChild(d);
    while (s.children.length > 150) s.removeChild(s.firstChild);
    s.scrollTop = s.scrollHeight;
  }

  async function poll() {
    try {
      // state live
      const r = await fetch("/api/v2/state/live"); const d = await r.json();
      const st = (d.state || "setup").toLowerCase();
      $("state").textContent = st.toUpperCase();
      $("state").className = "state-big " + st;
      const prev = d.previous ? d.previous.toUpperCase() : "—";
      $("prev").textContent = `previous: ${prev}`;
      const hist = $("hist"); hist.innerHTML = "";
      (d.history || []).slice(-6).reverse().forEach(h => {
        const x = document.createElement("div"); x.className = "item";
        x.innerHTML = `${html(h.from)} <span class="arrow">→</span> <strong>${html(h.to)}</strong> <span class="arrow">via</span> ${html(h.via||"")}`;
        hist.appendChild(x);
      });
    } catch(e){}
    try {
      const r = await fetch("/api/v2/health/current"); const d = await r.json();
      const sc = d.score || 0;
      const v = (d.verdict || "—").toLowerCase();
      $("score").textContent = sc;
      $("score").className = "num " + v;
      $("verd").textContent = (d.verdict || "—").toUpperCase();
      $("fill").style.width = Math.max(0, Math.min(100, sc)) + "%";
      $("evcount").textContent = d.event_count || 0;
      $("elapsed").textContent = (d.elapsed_s || 0).toFixed(1) + "s";
    } catch(e){}
    try {
      const r = await fetch("/api/v2/drift/current"); const d = await r.json();
      const dc = d.drift_count || 0;
      $("drift-stat").textContent = dc + " drift" + (dc===1?"":"s");
      $("drift-stat").className = "drift-stat " + (dc === 0 ? "zero" : "has");
      const list = $("drift-list"); list.innerHTML = "";
      if ((d.drifts||[]).length === 0) {
        list.innerHTML = '<div class="empty">No drifts</div>';
      } else {
        d.drifts.slice(-8).reverse().forEach(x => {
          const el = document.createElement("div"); el.className = "drift-item";
          el.innerHTML = `<div class="kind">${html(x.kind||"?")}</div>` +
                         `<div>event: <strong>${html(x.event||"?")}</strong></div>` +
                         `<div class="detail">${html(x.detail||"")}</div>`;
          list.appendChild(el);
        });
      }
    } catch(e){}
    try {
      const r = await fetch("/api/v2/loops/current"); const d = await r.json();
      const lst = $("loops"); lst.innerHTML = "";
      const loops = (d.active_loops||[]).sort((a,b)=>b.count-a.count);
      if (loops.length === 0) {
        lst.innerHTML = '<div class="empty">No active loops</div>';
      } else {
        loops.slice(0,8).forEach(l => {
          const c = l.count;
          const cls = c >= 15 ? "danger" : c >= 8 ? "hot" : c >= 4 ? "warm" : "cold";
          const el = document.createElement("div"); el.className = "loop-item";
          el.innerHTML = `<span>${html(l.event)}</span><span class="count ${cls}">${c}×</span>`;
          lst.appendChild(el);
        });
      }
    } catch(e){}
  }

  function connectSSE() {
    const es = new EventSource("/api/v1/stream");
    es.addEventListener("hello", () => { $("dot").classList.remove("off"); $("conn").textContent = "live"; });
    es.onmessage = e => { try { renderEvent(JSON.parse(e.data)); } catch(_){} };
    es.onerror = () => { $("dot").classList.add("off"); $("conn").textContent = "reconnecting..."; es.close(); setTimeout(connectSSE, 2000); };
  }
  poll(); setInterval(poll, 1500); connectSSE();
})();
</script>
</body>
</html>
