<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TM Control Tower — Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0a0e1a; color: #e6edf3;
       font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.4; }
.top { padding: 14px 20px; background: linear-gradient(135deg,#026CDF,#0052b4);
       display: flex; align-items: center; gap: 14px; }
.top h1 { margin: 0; font-size: 18px; }
.top .sub { color: rgba(255,255,255,.75); font-size: 12px; }
.top .nav { margin-left: auto; display: flex; gap: 12px; }
.top .nav a { color: rgba(255,255,255,.85); text-decoration: none; padding: 4px 10px;
              border-radius: 4px; background: rgba(0,0,0,.2); font-size: 11px; }
.top .nav a.active { background: rgba(255,255,255,.2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
.dot.off { background: #ef4444; }
.top .status { display: flex; gap: 8px; align-items: center; font-size: 12px; }

.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; padding: 14px; min-height: calc(100vh - 56px); }
.card { background: #131826; border: 1px solid #2a3346; border-radius: 6px; padding: 14px; }
.card h3 { margin: 0 0 10px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: #8b95a8; }

/* Run analytics */
.metric-row { display: flex; justify-content: space-between; padding: 4px 0;
              border-bottom: 1px solid #2a3346; font-size: 12px; }
.metric-row .label { color: #8b95a8; }
.metric-row .value { font-weight: 700; }
.metric-row.warn .value { color: #f59e0b; }
.metric-row.bad .value { color: #ef4444; }
.metric-row.good .value { color: #22c55e; }

.status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px;
                font-weight: 700; text-transform: uppercase; letter-spacing: .8px; }
.status-badge.running   { background: #06b6d4; color: #fff; }
.status-badge.success   { background: #22c55e; color: #fff; }
.status-badge.degraded  { background: #f59e0b; color: #fff; }
.status-badge.failed    { background: #ef4444; color: #fff; }
.status-badge.blocked   { background: #b91c1c; color: #fff; }
.status-badge.fatal     { background: #ef4444; color: #fff; }
.status-badge.stopped   { background: #64748b; color: #fff; }
.severity-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; }
.severity-badge.high { background: #ef4444; color: #fff; }
.severity-badge.medium { background: #f59e0b; color: #fff; }
.severity-badge.low { background: #06b6d4; color: #fff; }
.severity-badge.info { background: #64748b; color: #fff; }

/* Root cause */
.rc-name { font-size: 16px; font-weight: 800; color: #ef4444; margin: 8px 0 4px; }
.rc-conf { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px;
           background: #1a2235; color: #8b95a8; }
.rc-conf.high { background: #22c55e; color: #fff; }
.rc-conf.medium { background: #f59e0b; color: #fff; }
.rc-section { margin-top: 8px; }
.rc-section .key { color: #8b95a8; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px; }
.rc-section .val { font-size: 12px; }
.rc-remediation { background: rgba(34,197,94,.08); border-left: 3px solid #22c55e;
                  padding: 8px; border-radius: 3px; font-size: 12px; }

/* Failure trace */
.trace-step { padding: 4px 8px; border-radius: 2px; background: #1a2235; margin-bottom: 3px; }
.trace-step.failure { background: rgba(239,68,68,.15); border-left: 3px solid #ef4444;
                       font-weight: 700; color: #ef4444; }
.trace-step .arrow { color: #8b95a8; margin: 0 4px; }

/* Filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.pill { font-size: 10px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
        background: #1a2235; border: 1px solid #2a3346; user-select: none; }
.pill.active { background: #026CDF; border-color: #026CDF; }
.search { width: 100%; padding: 6px 10px; background: #0a0e1a; border: 1px solid #2a3346;
          color: #e6edf3; border-radius: 4px; font-family: monospace; font-size: 12px; margin-bottom: 10px; }

/* Stream filtered */
.stream { font-size: 11px; max-height: 420px; overflow-y: auto;
          background: #0a0e1a; padding: 8px; border-radius: 4px; border: 1px solid #2a3346; }
.evt { padding: 1px 4px; display: flex; gap: 8px; }
.evt .ts { color: #8b95a8; width: 70px; flex-shrink: 0; }
.evt .kind { width: 80px; flex-shrink: 0; font-weight: 700; }
.evt .state { color: #8b95a8; width: 60px; flex-shrink: 0; }
.evt.STATE         .kind { color: #22c55e; }
.evt.STATE         { background: rgba(34,197,94,.05); }
.evt.ACTION        .kind { color: #06b6d4; }
.evt.OBSERVABILITY .kind { color: #8b95a8; }
.evt.OBSERVABILITY { opacity: .75; }
.evt.NOISE         .kind { color: #64748b; }
.evt.NOISE         { opacity: .4; }
.evt.UNKNOWN       .kind { color: #f59e0b; }
.evt.drift         { border-left: 3px solid #ef4444; padding-left: 6px; }

.empty { color: #8b95a8; padding: 8px 0; text-align: center; font-size: 11px; }
</style>
</head>
<body>
<div class="top">
  <h1>TM Control Tower</h1>
  <span class="sub">Control · run analytics + root cause</span>
  <div class="nav">
    <a href="/">MVP</a>
    <a href="/realtime">Realtime</a>
    <a href="/control" class="active">Control</a>
    <a href="/tower">Industrial</a>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">connecting...</span></div>
</div>

<div class="grid">

  <!-- Run analytics -->
  <div class="card">
    <h3>Run analytics</h3>
    <div style="text-align:center;margin:6px 0;">
      <span class="status-badge" id="status-badge">—</span>
      <span class="severity-badge" id="severity-badge" style="margin-left:6px;">—</span>
    </div>
    <div id="metrics"></div>
  </div>

  <!-- Root cause -->
  <div class="card">
    <h3>Root cause detection</h3>
    <div id="root-cause">
      <div class="empty">No failures detected</div>
    </div>
  </div>

  <!-- Failure trace -->
  <div class="card">
    <h3>Failure trace</h3>
    <div id="failure-trace">
      <div class="empty">No failure path</div>
    </div>
  </div>

  <!-- Event stream filtered -->
  <div class="card" style="grid-column: 1 / 4;">
    <h3>Event stream · filtered</h3>
    <div class="filters">
      <span class="pill active" data-k="STATE">STATE</span>
      <span class="pill active" data-k="ACTION">ACTION</span>
      <span class="pill active" data-k="OBSERVABILITY">OBSERVABILITY</span>
      <span class="pill" data-k="NOISE">NOISE</span>
      <span class="pill active" data-k="UNKNOWN">UNKNOWN</span>
      <span class="pill" data-only-drift="1" style="margin-left:auto;">⚠ only drift</span>
    </div>
    <input class="search" id="search" placeholder="search event (substring)...">
    <div class="stream" id="stream"></div>
  </div>

</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  function html(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function safe(v){ return v===null||v===undefined ? "—" : v; }

  // ── Filter state ──
  const enabledKinds = new Set(["STATE","ACTION","OBSERVABILITY","UNKNOWN"]);
  let onlyDrift = false;
  let searchTerm = "";

  document.querySelectorAll(".pill[data-k]").forEach(p => {
    p.addEventListener("click", () => {
      const k = p.dataset.k;
      if (enabledKinds.has(k)) { enabledKinds.delete(k); p.classList.remove("active"); }
      else { enabledKinds.add(k); p.classList.add("active"); }
      reloadEvents();
    });
  });
  document.querySelector('.pill[data-only-drift]').addEventListener("click", function() {
    onlyDrift = !onlyDrift;
    this.classList.toggle("active", onlyDrift);
    reloadEvents();
  });
  $("search").addEventListener("input", e => { searchTerm = e.target.value; reloadEvents(); });

  function renderEvent(rec, container) {
    const kind = rec.kind || "UNKNOWN";
    if (!enabledKinds.has(kind)) return;
    if (onlyDrift && !rec.drift) return;
    if (searchTerm && !(rec.event || "").toLowerCase().includes(searchTerm.toLowerCase())) return;
    const ts = (rec.ts||"").substring(11,19);
    const state = rec.state || "—";
    const evt = rec.event || "?";
    const d = document.createElement("div");
    d.className = "evt " + kind + (rec.drift ? " drift" : "");
    d.innerHTML = `<span class="ts">${ts}</span><span class="kind">${kind.padEnd(13)}</span>` +
                  `<span class="state">${state}</span><span>${html(evt)}</span>`;
    container.appendChild(d);
  }

  async function reloadEvents() {
    try {
      const params = new URLSearchParams();
      params.set("n", "150");
      if (enabledKinds.size < 5) params.set("kinds", Array.from(enabledKinds).join(","));
      if (onlyDrift) params.set("with_drift", "true");
      if (searchTerm) params.set("search", searchTerm);
      const r = await fetch("/api/v3/events/recent?" + params.toString());
      const d = await r.json();
      const s = $("stream"); s.innerHTML = "";
      (d.events || []).forEach(e => renderEvent(e, s));
      s.scrollTop = s.scrollHeight;
    } catch(e){}
  }

  function renderMetrics(a) {
    const m = $("metrics"); m.innerHTML = "";
    if (!a) { m.innerHTML = '<div class="empty">No active run</div>'; return; }
    $("status-badge").textContent = (a.status||"—").toUpperCase();
    $("status-badge").className = "status-badge " + (a.status||"—");
    $("severity-badge").textContent = "severity: " + (a.severity||"—");
    $("severity-badge").className = "severity-badge " + (a.severity||"info");

    const rows = [
      ["Duration", (a.duration_s||0).toFixed(1)+"s"],
      ["Events", a.event_count||0],
      ["Throughput", (a.event_throughput||0).toFixed(2)+"/s"],
      ["States visited", `${a.states_count||0}/5`],
      ["FSM coverage", (a.fsm_coverage_pct||0).toFixed(0)+"%"],
      ["Health score", a.health_score],
      ["Health verdict", a.health_verdict],
      ["Drifts", a.drift_count||0],
      ["Has failures", a.has_failures ? "yes" : "no"],
      ["Exit outcome", a.exit_outcome || "—"],
    ];
    rows.forEach(([k,v]) => {
      const r = document.createElement("div"); r.className = "metric-row";
      r.innerHTML = `<span class="label">${k}</span><span class="value">${html(String(v))}</span>`;
      m.appendChild(r);
    });
  }

  function renderRootCause(rc) {
    const c = $("root-cause");
    if (!rc) { c.innerHTML = '<div class="empty">No failures detected</div>'; return; }
    c.innerHTML = `
      <div class="rc-name">${html(rc.root_cause||"?")}</div>
      <span class="rc-conf ${rc.confidence||""}">confidence: ${html(rc.confidence||"?")}</span>
      <span style="margin-left:6px;font-size:11px;color:#8b95a8;">cat: ${html(rc.category||"?")}</span>
      <div class="rc-section">
        <div class="key">Description</div>
        <div class="val">${html(rc.description||"")}</div>
      </div>
      <div class="rc-section">
        <div class="key">Failure event</div>
        <div class="val"><strong style="color:#ef4444">${html(rc.failure_event||"?")}</strong></div>
      </div>
      <div class="rc-section">
        <div class="key">State at failure</div>
        <div class="val">${html(rc.state_at_failure||"?")}</div>
      </div>
      <div class="rc-section">
        <div class="key">Remediation</div>
        <div class="rc-remediation">${html(rc.remediation||"")}</div>
      </div>
    `;
  }

  function renderTrace(rc) {
    const c = $("failure-trace");
    if (!rc || !rc.failure_path || rc.failure_path.length === 0) {
      c.innerHTML = '<div class="empty">No failure path</div>'; return;
    }
    c.innerHTML = "";
    rc.failure_path.forEach((step, i) => {
      const isLast = i === rc.failure_path.length - 1;
      const d = document.createElement("div");
      d.className = "trace-step" + (isLast ? " failure" : "");
      const arrow = isLast ? "" : ' <span class="arrow">↓</span>';
      d.innerHTML = html(step) + arrow;
      c.appendChild(d);
    });
  }

  async function pollAnalytics() {
    try {
      // Get current run slot
      const r = await fetch("/api/v1/state");
      const s = await r.json();
      const slot = s.slot;
      if (slot === null || slot === undefined) {
        renderMetrics(null); renderRootCause(null); renderTrace(null);
        return;
      }
      const [aRes, rcRes] = await Promise.all([
        fetch(`/api/v3/run/${slot}/analytics`),
        fetch(`/api/v3/run/${slot}/root-cause`),
      ]);
      const a = await aRes.json();
      const rc = await rcRes.json();
      renderMetrics(a.analytics);
      renderRootCause(rc.root_cause);
      renderTrace(rc.root_cause);
    } catch(e){}
  }

  function connectSSE() {
    const es = new EventSource("/api/v1/stream");
    es.addEventListener("hello", () => { $("dot").classList.remove("off"); $("conn").textContent = "live"; });
    es.onmessage = e => {
      try {
        const rec = JSON.parse(e.data);
        const s = $("stream");
        renderEvent(rec, s);
        while (s.children.length > 200) s.removeChild(s.firstChild);
        s.scrollTop = s.scrollHeight;
      } catch(_){}
    };
    es.onerror = () => { $("dot").classList.add("off"); $("conn").textContent = "reconnecting..."; es.close(); setTimeout(connectSSE,2000); };
  }
  reloadEvents();
  pollAnalytics();
  setInterval(pollAnalytics, 2000);
  connectSSE();
})();
</script>
</body>
</html>
